<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niauchi TOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f0efea;
  color: #1a1a1a;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── 頂部導覽列 ── */
#topbar {
  background: #1a1a1a;
  padding: 0 24px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  text-decoration: none;
}
.brand:hover .brand-dot { background: #5aadff; }

.brand-dot {
  width: 7px;
  height: 7px;
  background: #378ADD;
  border-radius: 50%;
  transition: background 0.15s;
  flex-shrink: 0;
}

.brand-text { display: flex; flex-direction: column; gap: 1px; }
.brand-name { font-size: 13px; font-weight: 500; letter-spacing: 0.06em; color: rgba(255,255,255,0.92); }
.brand-sub  { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 0.12em; }

#topbar-right { display: flex; align-items: center; gap: 14px; }

#tool-label {
  font-size: 12px;
  color: rgba(255,255,255,0.40);
  letter-spacing: 0.05em;
  display: none;
}

#back-btn {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 5px 13px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  background: transparent;
  color: rgba(255,255,255,0.68);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.04em;
  transition: all 0.15s;
  white-space: nowrap;
}
#back-btn:hover { background: rgba(255,255,255,0.09); color: #fff; border-color: rgba(255,255,255,0.35); }

/* ── 主區塊 ── */
#main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* ── 首頁 ── */
#home { flex: 1; overflow-y: auto; padding: 52px 44px 44px; }

.home-eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: #999;
  margin-bottom: 10px;
  text-transform: uppercase;
}

.home-title {
  font-size: 26px;
  font-weight: 300;
  color: #1a1a1a;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}

.home-subtitle {
  font-size: 13px;
  color: #999;
  margin-bottom: 40px;
  letter-spacing: 0.02em;
}

/* ── 工具卡片格線 ── */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 14px;
}

.tool-card {
  background: #fff;
  border: 1px solid #dddcd7;
  border-radius: 14px;
  padding: 26px 26px 22px;
  cursor: pointer;
  transition: border-color 0.14s, box-shadow 0.14s, transform 0.14s;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
}
.tool-card:hover {
  border-color: #888;
  box-shadow: 0 5px 18px rgba(0,0,0,0.08);
  transform: translateY(-2px);
}

.tool-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }

.tool-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}
.icon-blue  { background: #e6f1fb; }
.icon-dark  { background: #1a1a1a; }
.icon-navy  { background: #1e3a5f; }

.arrow-icon {
  font-size: 14px;
  color: #ccc;
  transition: all 0.14s;
  margin-top: 2px;
}
.tool-card:hover .arrow-icon { color: #1a1a1a; transform: translate(2px, -2px); }

.tool-name { font-size: 15px; font-weight: 500; color: #1a1a1a; letter-spacing: 0.01em; }
.tool-desc { font-size: 12.5px; color: #888; line-height: 1.65; }

.tool-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
.tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: #f0efea;
  color: #777;
  letter-spacing: 0.04em;
}

/* ── iframe 容器 ── */
#frame-wrap {
  display: none;
  flex: 1;
  overflow: hidden;
}
#frame-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand" onclick="goHome()">
    <div class="brand-dot"></div>
    <div class="brand-text">
      <div class="brand-name">Niauchi TOOLS</div>
    </div>
  </div>
  <div id="topbar-right">
    <span id="tool-label"></span>
    <button id="back-btn" onclick="goHome()">← 工具列表</button>
  </div>
</div>

<div id="main">

  <div id="home">
    <div class="home-title">內部工具集</div>
    <div class="home-subtitle">點選工具開始使用</div>

    <div class="tool-grid">

      <div class="tool-card" onclick="openTool('gantt.html?v=2', '甘特圖產生器')">
        <div class="tool-card-top">
          <div class="tool-icon icon-blue">📊</div>
          <div class="arrow-icon">↗</div>
        </div>
        <div class="tool-name">甘特圖產生器</div>
        <div class="tool-desc">建立專案時程甘特圖，支援三層結構（大項／中項／細項），可調整顏色、寬度，並匯出圖片或列印。</div>
        <div class="tool-tags">
          <span class="tag">專案管理</span>
          <span class="tag">時程規劃</span>
          <span class="tag">匯出圖片</span>
        </div>
      </div>

      <div class="tool-card" onclick="openTool('accupass.html', 'ACCUPASS 橫幅產生器')">
        <div class="tool-card-top">
          <div class="tool-icon icon-dark">🎨</div>
          <div class="arrow-icon">↗</div>
        </div>
        <div class="tool-name">ACCUPASS 橫幅產生器</div>
        <div class="tool-desc">製作活動橫幅視覺，可編輯活動資訊、上傳圖片、調整色彩，直接匯出 1080×540 可用尺寸。</div>
        <div class="tool-tags">
          <span class="tag">活動視覺</span>
          <span class="tag">橫幅設計</span>
          <span class="tag">1080×540</span>
        </div>
      </div>

      <div class="tool-card" onclick="openTool('rundown.html', 'Rundown 產生器')">
        <div class="tool-card-top">
          <div class="tool-icon icon-navy">📋</div>
          <div class="arrow-icon">↗</div>
        </div>
        <div class="tool-name">Rundown 產生器</div>
        <div class="tool-desc">建立演出或活動流程表，編排節目順序、時間與說明，可匯出列印用格式。</div>
        <div class="tool-tags">
          <span class="tag">演出流程</span>
          <span class="tag">活動規劃</span>
          <span class="tag">列印匯出</span>
        </div>
      </div>

    </div>
  </div>

  <div id="frame-wrap">
    <iframe id="tool-frame" src="" title="工具"></iframe>
  </div>

</div>

<script>
  function openTool(file, name) {
    document.getElementById('home').style.display = 'none';
    document.getElementById('frame-wrap').style.display = 'flex';
    document.getElementById('tool-frame').src = file + '?v=2';
    document.getElementById('tool-label').textContent = name;
    document.getElementById('tool-label').style.display = 'block';
    document.getElementById('back-btn').style.display = 'flex';
  }

  function goHome() {
    document.getElementById('home').style.display = 'block';
    document.getElementById('frame-wrap').style.display = 'none';
    document.getElementById('tool-frame').src = '';
    document.getElementById('tool-label').style.display = 'none';
    document.getElementById('back-btn').style.display = 'none';
  }
</script>

</body>
</html>
