<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>批次照片裁切工具 · PO文尺寸</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b313d;
    --txt:#e6e9ef; --dim:#9aa4b2; --acc:#4f9cf9; --acc2:#2f6fd0;
    --ok:#3ec98a; --warn:#f0a44a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .wrap{max-width:1280px;margin:0 auto;padding:14px 18px}
  h1{font-size:17px;margin:0 0 10px;font-weight:650}
  h1 small{font-weight:400;color:var(--dim);font-size:12px;margin-left:8px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .row + .row{margin-top:10px}
  .group{display:flex;gap:6px;align-items:center;background:var(--panel);
         border:1px solid var(--line);border-radius:10px;padding:6px}
  .lbl{color:var(--dim);font-size:12px;padding:0 4px}
  button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);
         border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:#3d4658}
  button:disabled{opacity:.45;cursor:not-allowed}
  .spec{min-width:104px;text-align:center}
  .spec.on{background:var(--acc2);border-color:var(--acc);color:#fff}
  .spec b{display:block;font-size:13px}
  .spec span{display:block;font-size:11px;opacity:.8}
  .primary{background:var(--acc2);border-color:var(--acc);color:#fff;font-weight:600}
  .primary:hover{background:#3b7fdd}
  input[type=number]{width:74px;background:#0d0f14;color:var(--txt);border:1px solid var(--line);
                     border-radius:7px;padding:6px 8px;font:inherit}
  input[type=range]{accent-color:var(--acc);width:120px}
  select{background:#0d0f14;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit}

  #drop{margin:22px auto;max-width:1280px;padding:44px 18px;border:2px dashed var(--line);
        border-radius:16px;text-align:center;color:var(--dim);cursor:pointer;background:var(--panel)}
  #drop.hot{border-color:var(--acc);color:var(--txt);background:#182233}
  #drop b{display:block;color:var(--txt);font-size:16px;margin-bottom:6px}

  #grid{max-width:1280px;margin:0 auto;padding:0 18px 90px;
        display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        display:flex;flex-direction:column}
  .stage{position:relative;background:
        repeating-conic-gradient(#20242d 0 25%,#191d25 0 50%) 0 0/16px 16px;display:flex;
        align-items:center;justify-content:center;padding:10px}
  .stage canvas{max-width:100%;max-height:300px;display:block;cursor:grab;
        border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.45)}
  .stage canvas.drag{cursor:grabbing}
  .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.62);color:#fff;
         font-size:11px;padding:2px 7px;border-radius:20px}
  .del{position:absolute;top:6px;right:6px;padding:3px 9px;font-size:13px;
       background:rgba(0,0,0,.6);border-color:transparent}
  .del:hover{background:#a33;border-color:#c55}
  .meta{padding:8px 10px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctl{display:flex;gap:6px;align-items:center;padding:0 10px 10px}
  .ctl input[type=range]{flex:1;width:auto}
  .ctl button{padding:5px 9px;font-size:12px}

  footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.95);
         backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:20}
  footer .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px}
  #status{color:var(--dim);font-size:12.5px}
  .hint{color:var(--dim);font-size:12px;max-width:1280px;margin:0 auto;padding:0 18px 12px}
  kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>批次照片裁切工具 <small>一次把多張照片裁成同一尺寸，直接 PO 文</small></h1>

    <div class="row">
      <button class="spec on" data-w="1080" data-h="1350"><b>FB 直式</b><span>1080 × 1350</span></button>
      <button class="spec" data-w="1200" data-h="900"><b>FB 橫式</b><span>1200 × 900</span></button>
      <button class="spec" data-w="1080" data-h="1080"><b>正方形</b><span>1080 × 1080</span></button>
      <div class="group">
        <span class="lbl">自訂</span>
        <input type="number" id="cw" min="16" max="8000" value="1080">
        <span class="lbl">×</span>
        <input type="number" id="ch" min="16" max="8000" value="1350">
        <button id="applyCustom">套用</button>
      </div>
    </div>

    <div class="row">
      <div class="group">
        <span class="lbl">填滿方式</span>
        <select id="mode">
          <option value="cover">裁切填滿（不留白）</option>
          <option value="contain">完整縮放（補背景）</option>
        </select>
        <input type="color" id="bg" value="#ffffff" title="背景色（留白 / PNG 透明時無效）">
      </div>
      <div class="group">
        <span class="lbl">輸出</span>
        <select id="fmt">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
        <span class="lbl">品質</span>
        <input type="range" id="q" min="50" max="100" value="92">
        <span id="qv" class="lbl">92</span>
      </div>
      <div class="group">
        <button id="resetAll">全部重設位置</button>
        <button id="syncZoom">套用第一張的縮放到全部</button>
      </div>
    </div>
  </div>
</header>

<div id="drop">
  <b>點此選擇照片，或把照片拖進來</b>
  支援 JPG / PNG / WebP / GIF ‧ 可一次選多張 ‧ 全程在你的瀏覽器處理，不會上傳
  <input type="file" id="file" accept="image/*" multiple hidden>
</div>

<div class="hint">
  操作：在預覽圖上<b>拖曳</b>調整位置，<b>滾輪</b>縮放，<kbd>雙擊</kbd>重設該張。
</div>

<div id="grid"></div>

<footer>
  <div class="wrap">
    <button class="primary" id="dlZip">下載全部（ZIP）</button>
    <button id="dlEach">逐張下載</button>
    <span id="status">尚未加入照片</span>
  </div>
</footer>

<script>
/* ---------------- 狀態 ---------------- */
let W = 1080, H = 1350;
const items = [];
let uid = 0;

const $ = s => document.querySelector(s);
const grid = $('#grid'), statusEl = $('#status');

/* ---------------- 尺寸規格 ---------------- */
document.querySelectorAll('.spec').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.spec').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  setSize(+b.dataset.w, +b.dataset.h);
  $('#cw').value = W; $('#ch').value = H;
}));

$('#applyCustom').addEventListener('click', () => {
  const w = Math.round(+$('#cw').value), h = Math.round(+$('#ch').value);
  if (!(w >= 16 && h >= 16 && w <= 8000 && h <= 8000)) { alert('尺寸請介於 16 ~ 8000 px'); return; }
  document.querySelectorAll('.spec').forEach(x => x.classList.remove('on'));
  setSize(w, h);
});

function setSize(w, h) {
  W = w; H = h;
  items.forEach(it => { clampOffset(it); });
  items.forEach(drawPreview);
  updateStatus();
}

/* ---------------- 其他控制項 ---------------- */
$('#q').addEventListener('input', e => $('#qv').textContent = e.target.value);
$('#mode').addEventListener('change', () => { items.forEach(it => { clampOffset(it); drawPreview(it); }); });
$('#bg').addEventListener('input', () => items.forEach(drawPreview));
$('#resetAll').addEventListener('click', () => {
  items.forEach(it => { it.zoom = 1; it.ox = 0; it.oy = 0; it.rot = 0; drawPreview(it); });
});
$('#syncZoom').addEventListener('click', () => {
  if (!items.length) return;
  const z = items[0].zoom;
  items.forEach(it => { it.zoom = z; clampOffset(it); drawPreview(it); });
});

/* ---------------- 檔案載入 ---------------- */
const drop = $('#drop'), fileInput = $('#file');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value = ''; });
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('hot');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('hot');
}));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  if (e.target.closest('#drop')) return;
  e.preventDefault(); addFiles(e.dataTransfer.files);
});

async function addFiles(list) {
  const files = [...list].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  statusEl.textContent = `載入中… 0 / ${files.length}`;
  let n = 0;
  for (const f of files) {
    try {
      const src = await loadImage(f);
      const it = {
        id: ++uid, name: f.name, src,
        iw: src.width || src.naturalWidth, ih: src.height || src.naturalHeight,
        zoom: 1, ox: 0, oy: 0, rot: 0
      };
      items.push(it);
      buildCard(it);
    } catch (err) {
      console.error(f.name, err);
    }
    statusEl.textContent = `載入中… ${++n} / ${files.length}`;
  }
  updateStatus();
}

function loadImage(file) {
  if (window.createImageBitmap) {
    return createImageBitmap(file, { imageOrientation: 'from-image' })
      .catch(() => loadViaTag(file));
  }
  return loadViaTag(file);
}
function loadViaTag(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode fail')); };
    img.src = url;
  });
}

/* ---------------- 版面計算 ---------------- */
// 旋轉後的「有效」原圖尺寸
function eff(it) {
  return (it.rot % 180 === 0) ? { w: it.iw, h: it.ih } : { w: it.ih, h: it.iw };
}
function baseScale(it) {
  const e = eff(it), mode = $('#mode').value;
  return mode === 'cover' ? Math.max(W / e.w, H / e.h) : Math.min(W / e.w, H / e.h);
}
function clampOffset(it) {
  const e = eff(it), s = baseScale(it) * it.zoom;
  const dw = e.w * s, dh = e.h * s;
  const mx = Math.max(0, (dw - W) / 2), my = Math.max(0, (dh - H) / 2);
  it.ox = Math.min(mx, Math.max(-mx, it.ox));
  it.oy = Math.min(my, Math.max(-my, it.oy));
}

// 把 item 畫進尺寸為 outW×outH 的 ctx（outW/W 即縮放比例）
function render(it, ctx, outW, outH, guides) {
  const k = outW / W;
  ctx.clearRect(0, 0, outW, outH);
  if ($('#fmt').value !== 'image/png' || $('#mode').value === 'contain') {
    ctx.fillStyle = $('#bg').value;
    ctx.fillRect(0, 0, outW, outH);
  }
  const e = eff(it), s = baseScale(it) * it.zoom * k;
  const dw = e.w * s, dh = e.h * s;
  const cx = outW / 2 + it.ox * k, cy = outH / 2 + it.oy * k;

  ctx.save();
  ctx.imageSmoothingQuality = 'high';
  ctx.translate(cx, cy);
  ctx.rotate(it.rot * Math.PI / 180);
  ctx.drawImage(it.src, -it.iw * s / 2, -it.ih * s / 2, it.iw * s, it.ih * s);
  ctx.restore();

  if (guides) {
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
    for (let i = 1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(Math.round(outW * i / 3) + .5, 0); ctx.lineTo(Math.round(outW * i / 3) + .5, outH);
      ctx.moveTo(0, Math.round(outH * i / 3) + .5); ctx.lineTo(outW, Math.round(outH * i / 3) + .5);
      ctx.stroke();
    }
  }
}

/* ---------------- 卡片 ---------------- */
function buildCard(it) {
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.id = it.id;
  card.innerHTML = `
    <div class="stage">
      <canvas></canvas>
      <span class="badge"></span>
      <button class="del" title="移除">✕</button>
    </div>
    <div class="meta"></div>
    <div class="ctl">
      <button data-act="rotL" title="左轉 90°">⟲</button>
      <button data-act="rotR" title="右轉 90°">⟳</button>
      <input type="range" min="100" max="400" value="100">
      <button data-act="reset">重設</button>
    </div>`;
  grid.appendChild(card);
  it.el = card;
  it.canvas = card.querySelector('canvas');
  it.range = card.querySelector('input[type=range]');
  card.querySelector('.meta').textContent = `${it.name} · ${it.iw}×${it.ih}`;

  card.querySelector('.del').addEventListener('click', () => {
    const i = items.indexOf(it); if (i > -1) items.splice(i, 1);
    card.remove(); updateStatus();
  });
  it.range.addEventListener('input', () => {
    it.zoom = +it.range.value / 100; clampOffset(it); drawPreview(it);
  });
  card.querySelector('[data-act=reset]').addEventListener('click', () => resetItem(it));
  card.querySelector('[data-act=rotL]').addEventListener('click', () => {
    it.rot = (it.rot + 270) % 360; it.ox = it.oy = 0; clampOffset(it); drawPreview(it);
  });
  card.querySelector('[data-act=rotR]').addEventListener('click', () => {
    it.rot = (it.rot + 90) % 360; it.ox = it.oy = 0; clampOffset(it); drawPreview(it);
  });

  bindDrag(it);
  drawPreview(it);
}

function resetItem(it) {
  it.zoom = 1; it.ox = 0; it.oy = 0; it.rot = 0; it.range.value = 100; drawPreview(it);
}

function drawPreview(it) {
  const PW = 420;                              // 預覽解析度（依比例）
  const pw = Math.round(W >= H ? PW : PW * W / H);
  const ph = Math.round(pw * H / W);
  const c = it.canvas;
  if (c.width !== pw || c.height !== ph) { c.width = pw; c.height = ph; }
  c.style.aspectRatio = `${W} / ${H}`;
  render(it, c.getContext('2d'), pw, ph, true);
  it.el.querySelector('.badge').textContent = `${W}×${H} · ${Math.round(it.zoom * 100)}%`;
  if (+it.range.value !== Math.round(it.zoom * 100)) it.range.value = Math.round(it.zoom * 100);
}

function bindDrag(it) {
  const c = it.canvas;
  let dragging = false, lx = 0, ly = 0;
  const toOut = () => W / c.getBoundingClientRect().width;   // 顯示 px → 輸出 px

  c.addEventListener('pointerdown', e => {
    dragging = true; lx = e.clientX; ly = e.clientY;
    c.classList.add('drag'); c.setPointerCapture(e.pointerId);
  });
  c.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = toOut();
    it.ox += (e.clientX - lx) * r; it.oy += (e.clientY - ly) * r;
    lx = e.clientX; ly = e.clientY;
    clampOffset(it); drawPreview(it);
  });
  const end = e => { dragging = false; c.classList.remove('drag'); };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  c.addEventListener('dblclick', () => resetItem(it));
  c.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.08 : 1 / 1.08;
    it.zoom = Math.min(4, Math.max(1, it.zoom * f));
    it.ox *= f; it.oy *= f;
    clampOffset(it); drawPreview(it);
  }, { passive: false });
}

function updateStatus() {
  statusEl.textContent = items.length
    ? `${items.length} 張照片 · 輸出 ${W}×${H}`
    : '尚未加入照片';
  $('#dlZip').disabled = $('#dlEach').disabled = !items.length;
}
updateStatus();

/* ---------------- 輸出 ---------------- */
function outExt() {
  return { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[$('#fmt').value];
}
function outName(it, i) {
  const base = it.name.replace(/\.[^.]+$/, '') || `image_${i + 1}`;
  return `${String(i + 1).padStart(2, '0')}_${base}_${W}x${H}.${outExt()}`;
}
function exportBlob(it) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  render(it, c.getContext('2d'), W, H, false);
  return new Promise(res => c.toBlob(res, $('#fmt').value, +$('#q').value / 100));
}

$('#dlEach').addEventListener('click', async () => {
  const btn = $('#dlEach'); btn.disabled = true;
  for (let i = 0; i < items.length; i++) {
    statusEl.textContent = `輸出中… ${i + 1} / ${items.length}`;
    const b = await exportBlob(items[i]);
    saveBlob(b, outName(items[i], i));
    await new Promise(r => setTimeout(r, 220));   // 讓瀏覽器逐一觸發下載
  }
  btn.disabled = false; updateStatus();
});

$('#dlZip').addEventListener('click', async () => {
  const btn = $('#dlZip'); btn.disabled = true;
  const files = [];
  for (let i = 0; i < items.length; i++) {
    statusEl.textContent = `輸出中… ${i + 1} / ${items.length}`;
    const b = await exportBlob(items[i]);
    files.push({ name: outName(items[i], i), data: new Uint8Array(await b.arrayBuffer()) });
  }
  statusEl.textContent = '打包 ZIP…';
  saveBlob(zipStore(files), `crop_${W}x${H}_${items.length}p.zip`);
  btn.disabled = false; updateStatus();
});

function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------------- 極簡 ZIP（store，無壓縮） ---------------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const nb = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new Uint8Array(30 + nb.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true);      // 時間/日期（固定值）
    dv.setUint32(14, crc, true); dv.setUint32(18, sz, true); dv.setUint32(22, sz, true);
    dv.setUint16(26, nb.length, true); dv.setUint16(28, 0, true);
    lh.set(nb, 30);
    parts.push(lh, f.data);

    const cd = new Uint8Array(46 + nb.length), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, sz, true); cv.setUint32(24, sz, true);
    cv.setUint16(28, nb.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nb, 46);
    central.push(cd);
    offset += lh.length + sz;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob([...parts, ...central, eo], { type: 'application/zip' });
}
</script>
</body>
</html>
