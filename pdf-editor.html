<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 編輯器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e3e5e8;
  --accent:#2563eb; --accent-ink:#fff; --viewer:#d9dce1; --danger:#dc2626; --ok:#16a34a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --panel:#1f2227; --ink:#e7e9ec; --muted:#9aa1ab; --line:#30343a;
    --accent:#4f8bff; --accent-ink:#fff; --viewer:#0f1114; --danger:#f05252; --ok:#34d399;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:700}
header .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
#status{margin-left:auto;color:var(--muted);font-size:13px}
main{flex:1;display:flex;min-height:0}
#viewer{flex:1;overflow:auto;background:var(--viewer);padding:44px 16px 24px;position:relative}
#pages{display:flex;flex-direction:column;align-items:center;gap:50px}
.page{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);flex:none}
.page canvas.pg{display:block}
.sheet{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);flex:none}
.sheetin{position:relative}
.sheet .page{box-shadow:none;outline:1px dashed #cfd4dc}
.sheet .page>.pghead{display:none}
.th.pa{margin-bottom:2px;border-bottom-left-radius:2px;border-bottom-right-radius:2px;background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.th.pb{border-top-left-radius:2px;border-top-right-radius:2px;background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.overlay{position:absolute;inset:0}
.pghead{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.pghead .pl{font-weight:600}
.pghead button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:1px 8px;font:inherit;font-size:12px;cursor:pointer}
.pghead button:hover:not(:disabled){border-color:var(--accent)}
.pghead button:disabled{opacity:.4;cursor:default}
.pghead button.danger{color:var(--danger)}
.ti{position:absolute;cursor:text}
.ti:hover{outline:1px dashed var(--accent)}
.ti.sel{outline:2px solid var(--accent);outline-offset:1px}
.marks .ti.changed:not(.sel){outline:1px dotted rgba(22,163,74,.9);outline-offset:2px}
.marks .ti.deleted:not(.sel){outline:1px dotted rgba(220,38,38,.9);outline-offset:2px}
.ti canvas{position:absolute;pointer-events:none}
.placing .overlay,.placing .ti{cursor:crosshair}
.inl{position:absolute;z-index:20}
.inl input{display:block;padding:0 2px;border:2px solid var(--accent);border-radius:2px;background:#fff;color:#000;outline:none;margin:-2px 0 0 -4px}
.itb{position:absolute;left:-4px;bottom:100%;margin-bottom:6px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button,.itb button{border:0;background:transparent;color:var(--ink);padding:3px 9px;cursor:pointer;font:inherit;font-size:13px;display:flex;align-items:center;gap:3px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on,.itb button.on{background:var(--accent);color:var(--accent-ink)}
.itb button{border-radius:5px}
/* 新增的物件：簽名、文字框、符號 */
.obj{position:absolute;z-index:10;cursor:move;outline:1px dashed transparent;touch-action:none}
.obj:hover{outline-color:var(--accent)}
.obj.sel{outline:2px solid var(--accent)}
.obj.text{outline-color:rgba(37,99,235,.35)}
.obj-body{position:absolute;inset:0}
.obj-body img,.obj-body svg{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.obj-body canvas{position:absolute;pointer-events:none}
.obj-body .ph{color:#9ca3af;font-size:12px;padding:2px 4px;white-space:nowrap}
.obj-del{position:absolute;top:-10px;right:-10px;width:20px;height:20px;border-radius:50%;border:0;background:var(--danger);color:#fff;cursor:pointer;display:none;line-height:20px;padding:0;font-size:14px;z-index:2}
.obj-rs{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:var(--accent);border:2px solid #fff;border-radius:2px;cursor:nwse-resize;display:none;z-index:2}
.obj.text .obj-rs{cursor:ew-resize;bottom:calc(50% - 6px)}
.obj:hover .obj-del,.obj:hover .obj-rs,.obj.sel .obj-del,.obj.sel .obj-rs{display:block}
.obj-rot{position:absolute;left:50%;top:-30px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:grab;display:none;z-index:2}
.obj-rot::after{content:"";position:absolute;left:50%;top:12px;width:2px;height:14px;margin-left:-1px;background:var(--accent)}
.obj.sig:hover .obj-rot,.obj.sig.sel .obj-rot{display:block}
.guide{position:absolute;pointer-events:none;z-index:30;background:#e5368b}
.guide.v{top:0;bottom:0;width:1px}
.guide.h{left:0;right:0;height:1px}
.cellflash{position:absolute;pointer-events:none;z-index:29;border:2px solid #e5368b;background:rgba(229,54,139,.08);border-radius:2px;transition:opacity .6s}
.sect{font-size:13px;font-weight:600;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.algrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.algrid button{display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 4px;cursor:pointer;font:inherit;font-size:12px}
.algrid button:hover{border-color:var(--accent);color:var(--accent)}
.seg.full{display:flex}
.seg.full button{flex:1;justify-content:center}
textarea.tb-edit{position:absolute;inset:0;width:100%;min-height:0;border:0;border-radius:0;outline:none;resize:none;overflow:hidden;background:rgba(255,255,255,.92);white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
#empty{position:absolute;inset:24px;border:2px dashed var(--muted);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:16px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
#empty:hover,#empty.drag{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:999px;display:none;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* 頁面縮圖 */
#thumbs{width:172px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px;display:none}
.hasdoc #thumbs{display:block}
.thh{font-size:13px;font-weight:600;margin:0 0 8px}
.tgh{display:flex;align-items:center;gap:6px;font-size:12px;margin:10px 0 6px;padding:4px 6px;border-left:4px solid var(--accent);border-radius:4px;background:var(--bg);cursor:grab}
.tgh .tgn{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgh.drop-b{box-shadow:0 -4px 0 0 var(--accent)}
.tgh.dragging{opacity:.4}
.th{border-left-width:4px}
.orow{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--bg);cursor:grab}
.orow.cur{background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.orow.dragging{opacity:.4}
.orow.drop-b{box-shadow:0 -3px 0 0 var(--accent)}
.orow.drop-a{box-shadow:0 3px 0 0 var(--accent)}
.orow .ograb,.tgh .ograb{color:var(--muted);font-size:16px;line-height:1}
.orow .othumb{width:40px;flex:none}
.orow .othumb canvas{display:block;box-shadow:0 1px 3px rgba(0,0,0,.25);background:#fff}
.orow .oname{flex:1;min-width:0;display:flex;flex-direction:column}
.orow .oname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.orow button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;width:28px;height:26px;cursor:pointer}
.orow button:disabled{opacity:.35;cursor:default}
#orderList{max-height:55vh;overflow:auto}
/* 螢光筆：以色彩相乘疊上，黑字不會被蓋住 */
.hl{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;z-index:5}
.hl>div{position:absolute;border-radius:1px}
.hl.sel>div{outline:2px dashed var(--accent);outline-offset:1px}
.hlcap{position:absolute;inset:0;z-index:40;display:none;cursor:text}
.hlmode .hlcap{display:block}
.hlc{display:inline-flex;gap:4px;align-items:center}
.hlc button{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.hlc button.on{box-shadow:0 0 0 2px var(--accent)}
.th{position:relative;border:2px solid transparent;border-radius:8px;padding:5px;margin-bottom:8px;cursor:grab;background:var(--bg)}
.th:hover{border-color:var(--line)}
.th.dragging{opacity:.4}
.th.drop-b{box-shadow:0 -4px 0 0 var(--accent)}
.th.drop-a{box-shadow:0 4px 0 0 var(--accent)}
.thc canvas{width:100%;display:block;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.thf{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:12px;color:var(--muted)}
.tha{display:flex;gap:2px;opacity:0;transition:opacity .1s}
.th:hover .tha{opacity:1}
.tha button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:0 5px;cursor:pointer;font-size:12px;line-height:18px}
.tha button:hover{border-color:var(--accent)}
aside{width:330px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px}
aside h2{font-size:14px;margin:0 0 10px}
aside .muted,.muted{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:7px 8px;align-items:center;margin:10px 0;font-size:13px}
.kv .k{color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px;margin-left:4px}
.cls{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px}
.cls div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.cls b{font-weight:600}
textarea{width:100%;min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sw{display:flex;align-items:center;gap:6px}
input[type=color]{width:34px;height:24px;border:1px solid var(--line);border-radius:4px;padding:0;background:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal .box{background:var(--panel);border-radius:12px;padding:16px;max-width:100%}
#pad{background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block;max-width:100%;cursor:crosshair}
#toast{position:fixed;right:16px;bottom:16px;max-width:360px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;z-index:60;font-size:13px}
@media (max-width:760px){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:45vh}.hasdoc #thumbs{display:none}}
</style>
</head>
<body>
<header>
  <h1>📄 PDF 編輯器</h1>
  <button class="btn" id="bOpen" title="可一次選多個 PDF 合併開啟">📂 開啟 PDF</button>
  <button class="btn needdoc" id="bAddPdf" disabled title="把其他 PDF 加進目前的文件">➕ 新增 PDF</button>
  <button class="btn" id="bOpenProj" title="開啟先前儲存的專案檔（.json），從上次的狀態繼續編輯">📁 開啟專案</button>
  <select id="zoom" title="縮放">
    <option value="0.8">80%</option><option value="1">100%</option><option value="1.3" selected>130%</option>
    <option value="1.6">160%</option><option value="2">200%</option>
  </select>
  <button class="btn needdoc" id="bRotL" disabled title="整份文件所有頁面逆時針旋轉 90°">⟲ 全部左轉</button>
  <button class="btn needdoc" id="bRotR" disabled title="整份文件所有頁面順時針旋轉 90°">⟳ 全部右轉</button>
  <button class="btn needdoc" id="bPair" disabled title="從第 1 頁開始，每兩頁合併成一張（像列印的「每張 2 頁」）">⧉ 整份兩頁合一</button>
  <span class="sep"></span>
  <button class="btn needdoc" id="bText" disabled title="在頁面上加入新的文字框">𝐓 文字框</button>
  <button class="btn needdoc sym" data-shape="check" disabled title="加入勾勾">✓ 勾勾</button>
  <button class="btn needdoc sym" data-shape="square" disabled title="加入黑色正方形">■ 方塊</button>
  <button class="btn needdoc sym" data-shape="circle" disabled title="加入黑色圓形">● 圓點</button>
  <button class="btn needdoc" id="bHl" disabled title="螢光筆：在文字上拖曳反白，或在空白處框選區域">🖍 螢光筆</button>
  <span id="hlColors" hidden></span>
  <span class="sep"></span>
  <button class="btn needdoc" id="bSig" disabled title="支援 PNG、JPG、WebP、GIF 等圖檔，PNG 可保留透明背景">🖼 插入圖片 / 簽名</button>
  <button class="btn needdoc" id="bPad" disabled>✍️ 手寫簽名</button>
  <button class="btn" id="bFont" title="選用：額外載入 TTF/OTF 字型，會加入字型選單">🔤 加入其他字型</button>
  <label class="muted"><input type="checkbox" id="marks" checked> 顯示編輯標記</label>
  <button class="btn needdoc" id="bSaveProj" disabled title="把 PDF 與所有編輯存成專案檔（.json），之後可以繼續編輯">💾 儲存專案</button>
  <button class="btn primary needdoc" id="bExport" disabled>⬇ 匯出 PDF</button>
  <span id="status">尚未開啟檔案</span>
  <input type="file" id="fPdf" accept="application/pdf" multiple hidden>
  <input type="file" id="fAdd" accept="application/pdf" multiple hidden>
  <input type="file" id="fProj" accept=".json,application/json" hidden>
  <input type="file" id="fSig" accept="image/*" hidden>
  <input type="file" id="fFont" accept=".ttf,.otf" hidden>
</header>
<main id="main">
  <nav id="thumbs">
    <div class="thh">頁面 <span class="muted" style="font-weight:400">· 拖曳排序</span></div>
    <div id="thumbList"></div>
  </nav>
  <div id="viewer" class="marks">
    <div id="empty" role="button" tabindex="0" title="選擇 PDF 檔案">
      <div style="font-size:40px">📄</div>
      <div><b>點這裡選擇 PDF</b>（可一次選多個合併），或把檔案拖放進來</div>
      <div style="font-size:12px">也可以拖入先前儲存的專案檔（.json）繼續編輯<br>檔案只在你的瀏覽器中處理，不會上傳到任何地方</div>
    </div>
    <div id="pages"></div>
  </div>
  <aside id="side"></aside>
</main>
<div id="hint"></div>
<div id="toast"></div>
<div class="modal" id="orderModal">
  <div class="box" style="width:520px">
    <h2 id="orderTitle" style="margin:0 0 4px;font-size:15px"></h2>
    <p class="muted" style="margin:0 0 12px">拖曳或用 ↑ ↓ 調整順序，頁面會依這個順序合併。之後也能在左側縮圖再調整。</p>
    <div id="orderList"></div>
    <div class="row"><span style="flex:1"></span>
      <button class="btn" id="orderCancel">取消</button>
      <button class="btn primary" id="orderOk"></button>
    </div>
  </div>
</div>
<div class="modal" id="padModal">
  <div class="box">
    <h2 style="margin:0 0 10px;font-size:15px">手寫簽名</h2>
    <canvas id="pad"></canvas>
    <div class="row">
      <label class="sw">筆色 <input type="color" id="padColor" value="#1a1a8c"></label>
      <label class="sw">粗細 <input type="range" id="padW" min="1" max="8" value="3"></label>
      <span style="flex:1"></span>
      <button class="btn" id="padClear">清除</button>
      <button class="btn" id="padCancel">取消</button>
      <button class="btn primary" id="padOk">使用此簽名</button>
    </div>
  </div>
</div>

<script>
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';

const $ = id => document.getElementById(id);
// pages：目前的頁面順序（P.src = 原始 PDF 的頁碼索引）；objs：新增的簽名 / 文字框 / 符號
// files：開啟的來源 PDF；pages：目前的頁面順序（P.file + P.src 指向來源檔的第幾頁）
const S = { files:[], fileSeq:0, pages:[], scale:1.3, sel:null, objs:[], pending:null, drag:null,
            hl:{on:false, color:'#ffe94d'},
            alignBase:'page', alignRef:null, snap:true };

/* ---------- 字型目錄 ----------
   family: 系統字型家族名稱，匯出時從使用者電腦讀取（Chrome / Edge 的 Local Font Access）
   files:  r=一般 b=粗體 i=斜體 bi=粗斜體 → 對應 fonts/<id>.js（本機版，由 build_fonts.py 產生）
   std:    都取不到時改用的 PDF 內建字型 */
const FONTS = {
  kai:      {label:'標楷體',        family:'DFKai-SB', cjk:true, css:'"DFKai-SB","標楷體","BiauKai",serif', files:{r:'kaiu'}},
  jhenghei: {label:'微軟正黑體',    family:'Microsoft JhengHei', cjk:true, css:'"Microsoft JhengHei","微軟正黑體","PingFang TC",sans-serif', files:{r:'msjh',b:'msjhbd'}},
  pmingliu: {label:'新細明體',      family:'PMingLiU', cjk:true, css:'"PMingLiU","新細明體","Noto Serif TC",serif', files:{r:'pmingliu'}},
  arial:    {label:'Arial',           family:'Arial', css:'Arial,sans-serif', std:'Helvetica', files:{r:'arial',b:'arialbd',i:'ariali',bi:'arialbi'}},
  tnr:      {label:'Times New Roman', family:'Times New Roman', css:'"Times New Roman",serif', std:'TimesRoman', files:{r:'times',b:'timesbd',i:'timesi',bi:'timesbi'}},
  calibri:  {label:'Calibri',         family:'Calibri', css:'Calibri,sans-serif', std:'Helvetica', files:{r:'calibri',b:'calibrib',i:'calibrii',bi:'calibriz'}},
  cambria:  {label:'Cambria',         family:'Cambria', css:'Cambria,serif', std:'TimesRoman', files:{r:'cambria',b:'cambriab',i:'cambriai',bi:'cambriaz'}},
  georgia:  {label:'Georgia',         family:'Georgia', css:'Georgia,serif', std:'TimesRoman', files:{r:'georgia',b:'georgiab',i:'georgiai',bi:'georgiaz'}},
  verdana:  {label:'Verdana',         family:'Verdana', css:'Verdana,sans-serif', std:'Helvetica', files:{r:'verdana',b:'verdanab',i:'verdanai',bi:'verdanaz'}},
  tahoma:   {label:'Tahoma',          family:'Tahoma', css:'Tahoma,sans-serif', std:'Helvetica', files:{r:'tahoma',b:'tahomabd'}},

function loadFontFile(id){

  s.onerror = () => { s.remove(); delete fontWaits[id]; w.fail(new Error(`找不到 fonts/${id}.js`)); };

/* ---------- 從使用者電腦讀取字型（不需要把字型檔放上網站） ---------- */
let localFontsP=null;
function getLocalFonts(){
  if(!localFontsP) localFontsP = window.queryLocalFonts ? queryLocalFonts().catch(e=>{ console.warn(e); localFontsP=null; return null; }) : Promise.resolve(null);

async function localFontBytes(key, bold, italic){
  const fam=FONTS[key]?.family, list=fam && await getLocalFonts();
  if(!list) return null;
  const faces=list.filter(f=>f.family.toLowerCase()===fam.toLowerCase());
  const isB=f=>/bold|black|heavy/i.test(f.style), isI=f=>/italic|oblique/i.test(f.style);
  const plain=f=>/^(regular|normal|roman|book)$/i.test(f.style);
  for(const [b,i] of [[bold,italic],[bold,false],[false,italic],[false,false]]){
    const f = faces.find(f=>isB(f)===b && isI(f)===i && (b||i||plain(f))) || (!b&&!i && faces.find(f=>!isB(f)&&!isI(f)));
    if(!f) continue;
    const bytes = sfntFrom(new Uint8Array(await (await f.blob()).arrayBuffer()), f.postscriptName);
    return { bytes, id:'local:'+f.postscriptName, v:(b&&i?'bi':b?'b':i?'i':'r'), fauxBold:bold&&!b, fauxItalic:italic&&!i };
  }
  return null;
}
/* .ttc 字型集合 → 依 PostScript 名稱拆出單一字型（pdf-lib 只能嵌入單一字型） */
function sfntFrom(b, ps){
  if(String.fromCharCode(...b.subarray(0,4))!=='ttcf') return b;
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  const offs=[...Array(dv.getUint32(8))].map((_,i)=>dv.getUint32(12+4*i));
  const psName=off=>{
    for(let i=0;i<dv.getUint16(off+4);i++){
      const r=off+12+16*i;
      if(String.fromCharCode(...b.subarray(r,r+4))!=='name') continue;
      const t=dv.getUint32(r+8), cnt=dv.getUint16(t+2), strs=dv.getUint16(t+4);
      for(let j=0;j<cnt;j++){
        const e=t+6+12*j;
        if(dv.getUint16(e+6)!==6) continue;
        const raw=b.subarray(t+strs+dv.getUint16(e+10), t+strs+dv.getUint16(e+10)+dv.getUint16(e+8));
        return new TextDecoder([0,3].includes(dv.getUint16(e))?'utf-16be':'latin1').decode(raw);
      }
    }
  };
  const off=offs.find(o=>psName(o)===ps) ?? offs[0], n=dv.getUint16(off+4);
  const recs=[...Array(n)].map((_,i)=>({r:off+12+16*i, t:dv.getUint32(off+12+16*i+8), len:dv.getUint32(off+12+16*i+12)}));
  const out=new Uint8Array(12+16*n+recs.reduce((a,r)=>a+((r.len+3)&~3),0)), ov=new DataView(out.buffer);
  out.set(b.subarray(off,off+12),0);
  let pos=12+16*n;
  recs.forEach((r,i)=>{
    out.set(b.subarray(r.r,r.r+8),12+16*i); ov.setUint32(12+16*i+8,pos); ov.setUint32(12+16*i+12,r.len);
    out.set(b.subarray(r.t,r.t+r.len),pos); pos+=(r.len+3)&~3;
  });
  return out;
}
/* 依粗體 / 斜體挑選字型檔，沒有對應字重就標記為「模擬」 */
function pickVariant(key, bold, italic){

  for(const v of order) if(fl[v]) return { file:fl[v], v, fauxBold: bold && !v.includes('b'), fauxItalic: italic && !v.includes('i') };

}

/* ---------- 字元分類 ---------- */
function isLatin(ch){
  const c = ch.codePointAt(0);
  return (c>=0x20&&c<=0x7E)||(c>=0xA0&&c<=0xFF)||WIN_EXTRA.includes(ch);
}
function splitRuns(s){
  s = s.replace(/[\r\n\t]+/g,' ');
  const out=[];
  for(const ch of s){
    const k = isLatin(ch)?'latin':'cjk';
    const last = out[out.length-1];
    if(last && last.kind===k) last.s+=ch; else out.push({kind:k,s:ch});
  }
  return out;
}
function stats(s){
  const o={zh:0,en:0,num:0,other:0};
  for(const ch of s){
    if(/[0-9０-９]/.test(ch)) o.num++;
    else if(/[A-Za-zＡ-Ｚａ-ｚ]/.test(ch)) o.en++;
    else if(CJK_RE.test(ch)) o.zh++;
    else if(ch.trim()) o.other++;
  }
  return o;
}

/* ---------- 字體偵測：PDF 字型名稱 → 字型目錄 ---------- */
function detectKeys(name, serif, mono, cjkFont){
  const n = name.toLowerCase().replace(/[\s_\-,]/g,'');
  const cjk = /kai|biau/.test(n) ? 'kai'
    : /jheng|zhenghei|msjh/.test(n) ? 'jhenghei'
    : /ming|song|sung|simsun|mincho|serif|batang/.test(n) && !/sans/.test(n) ? 'pmingliu'
    : /hei|gothic|sans|yahei|pingfang/.test(n) ? 'jhenghei'
    : serif ? 'pmingliu' : 'jhenghei';
  const rules = [
    [/arial|arimo|liberationsans/,'arial'], [/helvetica/,'helv'], [/timesnewroman|tinos|liberationserif/,'tnr'],
    [/times/,'timesStd'], [/calibri|carlito/,'calibri'], [/cambria|caladea/,'cambria'], [/georgia/,'georgia'],
    [/verdana/,'verdana'], [/tahoma/,'tahoma'], [/segoe/,'segoe'], [/couriernew|cousine/,'cournew'],
    [/courier/,'courStd'], [/consola/,'consolas']
  ];
  let lat = cjkFont ? 'same' : null;
  if(!lat) for(const [re,k] of rules) if(re.test(n)){ lat=k; break; }
  if(!lat) lat = mono ? 'cournew' : serif ? 'tnr' : 'arial';
  return {cjk, lat};
}
function fontInfo(P, fontName, str){
  P.fontCache = P.fontCache||{};
  if(!P.fontCache[fontName]){
    let o={};
    try{ if(P.page.commonObjs.has(fontName)) o = P.page.commonObjs.get(fontName)||{}; }catch(e){}
    const st = P.styles[fontName]||{};
    const name = (o.name||'').replace(/^[A-Z]{6}\+/,'');
    const bold = !!(o.bold||o.black) || /bold|black|heavy|demi|semibold|w[6-9]\b|,b\b/i.test(name);
    const italic = !!o.italic || /italic|oblique/i.test(name);
    const mono = !!o.isMonospace || /courier|mono|consol/i.test(name) || st.fontFamily==='monospace';
    const serifName = /times|roman|georgia|garamond|cambria|book|ming|song|sung|simsun|mincho|batang|kai|serif/i.test(name) && !/sans/i.test(name);
    const serif = !mono && (serifName || (!name && (o.isSerifFont || st.fontFamily==='serif')));
    const cjkFont = /ming|song|sung|simsun|hei|kai|jheng|yahei|mincho|gothic|batang|gulim|dotum|cjk|pingfang|hiragino|biau|msung|uni(gb|cns|jis|ks)/i.test(name);
    P.fontCache[fontName] = { name: name || st.fontFamily || fontName, bold, italic, serif, mono, cjkFont };
  }
  const c = P.fontCache[fontName];
  const k = detectKeys(c.name, c.serif, c.mono, c.cjkFont || CJK_RE.test(str));
  return { name:c.name, bold:c.bold, italic:c.italic, cjkKey:k.cjk, latKey:k.lat };
}

const FILE_COLORS = ['#2563eb','#16a34a','#d97706','#db2777','#7c3aed','#0891b2','#65a30d','#dc2626'];
const hasDoc = () => S.files.length>0;
// 讀入一個 PDF 檔，建立它的頁面物件（P.file 指回來源檔案）
async function loadPdfFile(file){
  return loadPdfBytes(new Uint8Array(await file.arrayBuffer()), file.name.replace(/\.pdf$/i,''));
}
async function loadPdfBytes(bytes, name){
  const doc = await pdfjsLib.getDocument({
    data:bytes.slice(), cMapUrl:PDFJS_BASE+'cmaps/', cMapPacked:true,
    standardFontDataUrl:PDFJS_BASE+'standard_fonts/', fontExtraProperties:true
  }).promise;
  const f = { id:++S.fileSeq, name, bytes, doc, pages:[],
              color:FILE_COLORS[(S.fileSeq-1)%FILE_COLORS.length] };
  for(let i=0;i<doc.numPages;i++){
    const page = await doc.getPage(i+1);
    const tc = await page.getTextContent();
    f.pages.push({file:f, src:i, page, rot:0, vp1:page.getViewport({scale:1}), styles:tc.styles, raw:tc.items, items:null});
  }
  return f;
}
/* 開啟檔案：adding=true 代表加入目前的文件 */
async function openFiles(list, adding){
  const pdfs=[...list].filter(x=>/pdf$/i.test(x.type)||/\.pdf$/i.test(x.name));
  if(!pdfs.length) return;
  const loaded=[];
  for(const [i,file] of pdfs.entries()){
    status(`讀取中… ${i+1}/${pdfs.length}　${file.name}`);
    try{ loaded.push(await loadPdfFile(file)); }
    catch(e){ console.error(e); alert(`無法開啟「${file.name}」：${e.message}`); }
  }
  if(!loaded.length){ status(); return; }
  let order = loaded;
  if(adding || loaded.length>1){
    // 目前文件依檔案分段列出，新檔案就能插在任兩段之間
    const runs=[];
    if(adding) for(const P of S.pages){ const r=runs[runs.length-1]; if(r && r.file===P.file) r.pages.push(P); else runs.push({current:true, file:P.file, pages:[P]}); }
    const items=[...runs, ...loaded];
    order = await orderDialog(items, adding);
    if(!order){ status(); return; }
  }
  const newFiles=order.filter(x=>!x.current);
  const pages=order.flatMap(x=>x.pages);
  if(!adding){
    showDoc(newFiles, pages);
    await renderAll();
  }else{
    S.files.push(...newFiles);
    const fresh=newFiles.flatMap(f=>f.pages);
    for(const [i,P] of fresh.entries()){ await renderPage(P); status(`算繪中… ${i+1}/${fresh.length}`); }
    applyOrder(pages);
    toast(`已加入 ${newFiles.length} 個檔案，共 ${fresh.length} 頁`);
  }
  showSide(); status();
  buildThumbs();
}
// 換成新的文件（開啟檔案或專案時）
function showDoc(files, pages){

  $('empty').style.display='none';

// 匯出檔名：單一檔案用原檔名，多檔合併用第一個檔名 + 「_合併」
function baseName(){
  const used=[...new Set(S.pages.map(P=>P.file))];
  return used.length>1 ? `${used[0].name}_合併` : (used[0]?.name||'document');
}

/* 排列檔案順序的視窗；回傳排好的陣列，取消回傳 null */
function orderDialog(items, adding){
  return new Promise(resolve=>{
    let order=[...items], dragI=null;
    const list=$('orderList');
    $('orderTitle').textContent = adding ? '新增 PDF：排列順序' : `合併 ${items.length} 個 PDF：排列順序`;
    $('orderOk').textContent = adding ? '加入' : '合併開啟';
    const draw=()=>{
      list.innerHTML='';
      order.forEach((it,i)=>{
        const name = it.current ? `${it.file.name}.pdf（已開啟）` : it.name+'.pdf';
        const n = it.pages.length;
        const row=document.createElement('div'); row.className='orow'+(it.current?' cur':''); row.draggable=true;
        row.style.borderLeftColor = it.current ? it.file.color : it.color;
        row.innerHTML=`<span class="ograb" title="拖曳排序">≡</span><span class="othumb"></span>
          <span class="oname"><b>${esc(name)}</b><span class="muted">${n} 頁</span></span>
          <button type="button" data-m="-1" title="往上" ${i===0?'disabled':''}>↑</button>
          <button type="button" data-m="1" title="往下" ${i===order.length-1?'disabled':''}>↓</button>
          ${it.current?'<span style="width:28px"></span>':'<button type="button" data-x title="不要加入這個檔案">✕</button>'}`;
        const P0 = it.pages[0];
        if(P0) miniThumb(P0, 40).then(c=>row.querySelector('.othumb').append(c));
        row.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
          const j=i+ +b.dataset.m; [order[i],order[j]]=[order[j],order[i]]; draw(); });
        row.querySelector('[data-x]')?.addEventListener('click',()=>{ order.splice(i,1); draw(); });
        row.addEventListener('dragstart',e=>{ dragI=i; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',''); });
        row.addEventListener('dragend',()=>{ dragI=null; draw(); });
        row.addEventListener('dragover',e=>{ if(dragI===null) return; e.preventDefault();
          const r=row.getBoundingClientRect(), before=e.clientY<r.top+r.height/2;
          list.querySelectorAll('.orow').forEach(x=>x.classList.remove('drop-b','drop-a'));
          row.classList.add(before?'drop-b':'drop-a'); });
        row.addEventListener('drop',e=>{ if(dragI===null) return; e.preventDefault(); e.stopPropagation();
          const before=row.classList.contains('drop-b'), moved=order[dragI];
          order.splice(dragI,1); let j=order.indexOf(it); if(!before) j++; order.splice(j,0,moved); dragI=null; draw(); });
        list.append(row);
      });
      $('orderOk').disabled = !order.some(x=>!x.current);
    };
    const close=v=>{ $('orderModal').style.display='none'; resolve(v); };
    $('orderOk').onclick=()=>close(order);
    $('orderCancel').onclick=()=>close(null);
    draw();
    $('orderModal').style.display='flex';
  });
}
async function miniThumb(P, w){
  const dpr=window.devicePixelRatio||1, v=P.page.getViewport({scale:w/P.vp1.width*dpr, rotation:viewRot(P)});
  const c=document.createElement('canvas'); c.width=Math.round(v.width); c.height=Math.round(v.height);
  c.style.width=w+'px';
  await P.page.render({canvasContext:c.getContext('2d'), viewport:v}).promise;
  return c;
}

/* ---------- 頁面縮圖：連續來自同一檔案的頁面歸成一組 ---------- */
const clearDrop = () => document.querySelectorAll('.drop-b,.drop-a').forEach(t=>t.classList.remove('drop-b','drop-a'));
// 把 block（一頁或一整組）移到 target 頁的前 / 後
function moveBlock(block, target, before){
  // 合併中的兩頁一起移動，也不能插進兩頁之間
  const set=new Set(block); block.forEach(P=>{ if(P.mate) set.add(P.mate); if(P.mateOf) set.add(P.mateOf); });
  if(set.has(target)) return;
  if(before && target.mateOf) target=target.mateOf;
  if(!before && target.mate) target=target.mate;
  const moved=S.pages.filter(x=>set.has(x)), a=S.pages.filter(x=>!set.has(x));
  a.splice(a.indexOf(target)+(before?0:1),0,...moved);
  applyOrder(a);
}
function dropTarget(el, onDrop){
  el.addEventListener('dragover',e=>{
    if(!S.drag) return;
    e.preventDefault(); e.stopPropagation();
    const r=el.getBoundingClientRect(), before=el.classList.contains('tgh') || e.clientY<r.top+r.height/2;
    clearDrop(); el.classList.add(before?'drop-b':'drop-a');
  });
  el.addEventListener('drop',e=>{
    if(!S.drag) return;
    e.preventDefault(); e.stopPropagation();
    const before=el.classList.contains('drop-b'); clearDrop();
    onDrop(before);
  });
}
function makeThumb(P){
  const th=document.createElement('div'); th.className='th'; th.draggable=true;
  th.innerHTML=`<div class="thc"></div><div class="thf"><span class="thn"></span>
    <span class="tha"><button data-act="rotr" title="此頁順時針旋轉 90°">⟳</button><button data-act="export" title="只匯出這一頁">⬇</button><button data-act="del" title="刪除這一頁">🗑</button></span></div>`;
  P.thumb=th; P.thumbN=th.querySelector('.thn');
  th.addEventListener('click',e=>{
    const a=e.target.closest('button')?.dataset.act;
    if(a){ e.stopPropagation(); pageAction(P,a); return; }
    P.el?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  th.addEventListener('dragstart',e=>{ S.drag=[P]; th.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',''); });
  th.addEventListener('dragend',()=>{ S.drag=null; th.classList.remove('dragging'); clearDrop(); });
  dropTarget(th, before=>moveBlock(S.drag, P, before));
}
function layoutThumbs(){
  const list=$('thumbList'); list.replaceChildren();
  const multi=new Set(S.pages.map(P=>P.file)).size>1 || S.files.length>1;
  for(let i=0;i<S.pages.length;){
    let j=i; while(j<S.pages.length && S.pages[j].file===S.pages[i].file) j++;
    const run=S.pages.slice(i,j), f=run[0].file;
    if(multi){
      const h=document.createElement('div'); h.className='tgh'; h.draggable=true; h.style.borderLeftColor=f.color;
      h.title='拖曳可移動整組頁面';
      h.innerHTML=`<span class="tgn">${esc(f.name)}</span><span class="muted">${run.length} 頁</span><span class="ograb">≡</span>`;
      h.addEventListener('dragstart',e=>{ S.drag=run; h.classList.add('dragging'); run.forEach(P=>P.thumb?.classList.add('dragging'));
        e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',''); });
      h.addEventListener('dragend',()=>{ S.drag=null; clearDrop(); layoutThumbs(); });
      dropTarget(h, ()=>moveBlock(S.drag, run[0], true));
      list.append(h);
    }
    for(const P of run){ if(!P.thumb) makeThumb(P); P.thumb.style.borderLeftColor = multi ? f.color : ''; P.thumb.classList.remove('dragging'); list.append(P.thumb); }
    i=j;
  }
}
async function buildThumbs(){
  layoutThumbs(); relabel();
  for(const P of S.pages) if(!P.thumbDone){ P.thumbDone=true; await renderThumb(P); }
}
async function renderThumb(P){

}

function hlSwatches(sel, id){
  return `<span class="hlc" id="${id}">${HL_COLORS.map(([c,n])=>`<button type="button" data-c="${c}" title="${n}" class="${c===sel?'on':''}" style="background:${c}"></button>`).join('')}</span>`;
}
/* 頁面文字的「行」與字元位置（PDF 座標，y 向上），用來把滑鼠位置換算成字元 */
function textModel(P){
  if(P.tm) return P.tm;
  const ctx=document.createElement('canvas').getContext('2d'), lines=[];
  const items=(P.items||[]).filter(it=>it.t[0]>0 && Math.abs(it.t[1])<1e-3 && Math.abs(it.t[2])<1e-3 && it.str.length);
  for(const it of items){
    // 每個字的寬度：以對應字型量測，再等比例縮放到 PDF 記錄的總寬
    const chars=[...it.str], ws=chars.map(ch=>{ ctx.font=cssFont(it, isLatin(ch)?'latin':'cjk', 100); return ctx.measureText(ch).width||50; });
    const k=it.w/ws.reduce((a,b)=>a+b,0);
    let x=it.t[4];
    const slots=chars.map((ch,i)=>{ const s={x0:x, x1:x+ws[i]*k}; x=s.x1; return s; });
    const by=it.t[5], top=by+it.ca*it.size, bot=by+it.cd*it.size;
    let L=lines.find(l=>Math.abs(l.by-by)<0.4*Math.min(l.size,it.size));
    if(!L){ L={by, size:it.size, top, bot, slots:[]}; lines.push(L); }
    L.top=Math.max(L.top,top); L.bot=Math.min(L.bot,bot);
    L.slots.push(...slots.filter(s=>s.x1>s.x0));
  }
  lines.sort((a,b)=>b.by-a.by);
  const all=[];
  lines.forEach((L,li)=>{ L.slots.sort((a,b)=>a.x0-b.x0); L.start=all.length; L.slots.forEach(s=>{ s.line=li; all.push(s); }); L.end=all.length; });
  return P.tm={lines, all};
}
// 點 (x,y)（PDF 座標）對應到的插入位置；strict=true 時只接受落在文字上的點
function caretAt(P, x, y, strict){
  const {lines}=textModel(P);
  let best=null, bd=Infinity;
  lines.forEach(L=>{
    const d = y>L.top ? y-L.top : y<L.bot ? L.bot-y : 0;
    if(d<bd){ bd=d; best=L; }
  });
  if(!best || !best.slots.length) return null;
  const x0=best.slots[0].x0, x1=best.slots[best.slots.length-1].x1;
  if(strict && (bd>best.size*0.15 || x<x0-best.size || x>x1+best.size)) return null;
  if(x<=x0) return best.start;
  if(x>=x1) return best.end;
  for(let i=best.start;i<best.end;i++){ const s=textModel(P).all[i]; if(x<s.x1) return x>(s.x0+s.x1)/2 ? i+1 : i; }
  return best.end;
}
// 選取範圍 [a,b) → 每行一條整齊的色條（同一行相距太遠的字分開畫）
function selectionRects(P, a, b){
  const {lines, all}=textModel(P), out=[];
  if(a>b) [a,b]=[b,a];
  let seg=null;
  for(let i=a;i<b;i++){
    const s=all[i], L=lines[s.line];
    if(seg && seg.line===s.line && s.x0-seg.x1<L.size*1.2){ seg.x1=Math.max(seg.x1,s.x1); continue; }
    if(seg) out.push(seg);
    seg={line:s.line, x0:s.x0, x1:s.x1};
  }
  if(seg) out.push(seg);
  return out.map(g=>{ const L=lines[g.line]; return {x0:g.x0, x1:g.x1, y0:L.bot, y1:L.top}; });
}
// PDF 座標的矩形 → 畫面上的位置
function viewRect(P, R){
  const [ax,ay]=P.vp.convertToViewportPoint(R.x0,R.y0), [bx,by]=P.vp.convertToViewportPoint(R.x1,R.y1);
  return {left:Math.min(ax,bx), top:Math.min(ay,by), width:Math.abs(bx-ax), height:Math.abs(by-ay)};
}
function paintHl(el, P, rects, color){
  el.replaceChildren(...rects.map(R=>{
    const d=document.createElement('div'), v=viewRect(P,R);
    Object.assign(d.style,{left:v.left+'px',top:v.top+'px',width:v.width+'px',height:v.height+'px',background:color});
    return d;
  }));
}
function mountHl(o){
  const el=document.createElement('div'); el.className='hl'; o.el=el;
  o.P.overlay.append(el); drawHl(o);
}
function drawHl(o){
  if(!o.el?.isConnected) return;
  paintHl(o.el, o.P, o.rects, o.color);
  o.el.classList.toggle('sel', S.sel===o);
}
function hlCapture(P, cap){
  cap.addEventListener('pointerdown',e=>{
    e.preventDefault(); e.stopPropagation();
    cap.setPointerCapture(e.pointerId);
    const r=P.overlay.getBoundingClientRect();
    const pt=ev=>P.vp.convertToPdfPoint(ev.clientX-r.left, ev.clientY-r.top);
    const [ax,ay]=pt(e), sx=e.clientX, sy=e.clientY;
    const startCaret=caretAt(P,ax,ay,true), mode=startCaret===null ? 'box' : 'text';
    const tmp=document.createElement('div'); tmp.className='hl'; P.overlay.append(tmp);
    let rects=[], moved=false;
    const mv=ev=>{
      if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>3) moved=true;
      const [bx,by]=pt(ev);
      if(mode==='text') rects=selectionRects(P, startCaret, caretAt(P,bx,by,false));
      else rects=[{x0:Math.min(ax,bx), x1:Math.max(ax,bx), y0:Math.min(ay,by), y1:Math.max(ay,by)}];
      paintHl(tmp, P, rects, S.hl.color);
    };
    const up=ev=>{
      cap.removeEventListener('pointermove',mv); cap.removeEventListener('pointerup',up);
      tmp.remove();
      if(!moved){                                // 只點一下：選取點到的螢光筆
        const [x,y]=pt(ev), hit=S.objs.find(o=>o.type==='hl' && o.P===P && o.rects.some(R=>x>=R.x0&&x<=R.x1&&y>=R.y0&&y<=R.y1));
        select(hit||null); return;
      }
      rects=rects.filter(R=>R.x1-R.x0>1 && R.y1-R.y0>1);
      if(!rects.length) return;
      const o={type:'hl', P, rects, color:S.hl.color};
      S.objs.push(o); mountHl(o); status();
    };
    cap.addEventListener('pointermove',mv); cap.addEventListener('pointerup',up);
  });
}
function sideHl(side, o){
  side.innerHTML = `
    <h2>螢光筆 <span class="muted">· 第 ${pageNo(o.P)} 頁</span></h2>
    <div class="kv"><span class="k">顏色</span>${hlSwatches(o.color,'hlSideColors')}</div>
    <div class="row"><button class="btn danger" id="hlDel">🗑 刪除螢光筆</button></div>
    <p class="muted" style="margin-top:14px">螢光筆以「色彩相乘」疊在頁面上，黑色文字不會被蓋住。</p>`;
  $('hlSideColors').querySelectorAll('button').forEach(b=>b.onclick=()=>{ o.color=b.dataset.c; drawHl(o); showSide(); });
  $('hlDel').onclick=()=>removeObj(o);
}

async function renderAll(){
  $('pages').innerHTML='';
  S.pages.forEach(P=>{ if(P.mate) sheetLayout(P); });
  for(const [i,P] of S.pages.entries()){ await renderPage(P); status(`算繪中… ${i+1}/${S.pages.length}`); }
  layoutPages(); relabel(); status();
}
const refreshAll = () => {
  S.pages.forEach(P=>(P.items||[]).forEach(refreshItem));
  S.objs.filter(o=>o.type==='text').forEach(drawObj);
};

// 頁面在畫面上的角度 = PDF 原本的 /Rotate + 使用者加的旋轉
const viewRot = P => ((P.page.rotate||0) + (P.rot||0) + 360) % 360;

/* 原有文字在畫面上的位置。框以「文字自身方向」描述：(x,y) 為框左上、ang 為文字方向（弧度），
   旋轉中心在基線左端 (x, y+bl)，頁面旋轉後文字框會跟著轉 */
function geom(it, vp){
  const tx = pdfjsLib.Util.transform(vp.transform, it.t);
  const fs = Math.hypot(tx[2],tx[3]) || Math.hypot(tx[0],tx[1]);
  const ang = Math.atan2(tx[1],tx[0]);
  // ca / cd：覆蓋框的上下緣（至少等於字型 ascent / descent，取樣後會依實際墨跡擴大）
  return { x:tx[4], y:tx[5]-it.ca*fs, w:it.w*vp.scale, h:(it.ca-it.cd)*fs, fs, bl:it.ca*fs, ang:Math.abs(ang)<1e-6?0:ang };
}
function placeBox(el, g){
  Object.assign(el.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px',
    transformOrigin:`0 ${g.bl}px`, transform:g.ang?`rotate(${g.ang}rad)`:''});
}
// 旋轉後文字框的外接矩形 [x0,y0,x1,y1]
function geomAABB(g){
  const c=Math.cos(g.ang), si=Math.sin(g.ang), ox=g.x, oy=g.y+g.bl;
  const pts=[[0,-g.bl],[g.w,-g.bl],[0,g.h-g.bl],[g.w,g.h-g.bl]].map(([u,v])=>[ox+u*c-v*si, oy+u*si+v*c]);
  const xs=pts.map(q=>q[0]), ys=pts.map(q=>q[1]);
  return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
}

async function renderPage(P){
  const vp = P.page.getViewport({scale:pk(P), rotation:viewRot(P)}); P.vp = vp;
  const dpr = window.devicePixelRatio||1;
  // 畫布尺寸取整數個裝置像素，避免被瀏覽器縮放而模糊
  const cw = Math.round(vp.width*dpr), ch = Math.round(vp.height*dpr);
  const wrap = document.createElement('div'); wrap.className='page';
  wrap.style.width=cw/dpr+'px'; wrap.style.height=ch/dpr+'px';
  const cv = document.createElement('canvas'); cv.className='pg';
  cv.width=cw; cv.height=ch; cv.style.width=cw/dpr+'px'; cv.style.height=ch/dpr+'px';
  const ov = document.createElement('div'); ov.className='overlay';
  const head = document.createElement('div'); head.className='pghead';
  head.innerHTML = `<span class="pl"></span><span style="flex:1"></span>
    <button data-act="rotl" title="此頁逆時針旋轉 90°">⟲</button><button data-act="rotr" title="此頁順時針旋轉 90°">⟳</button>
    <button data-act="up" title="往前移一頁">↑</button><button data-act="down" title="往後移一頁">↓</button>
    <button data-act="merge" title="和下一頁並排合併成一張">⧉ 與下一頁合併</button>
    <button data-act="export" title="只匯出這一頁">⬇ 匯出此頁</button>
    <button data-act="del" class="danger" title="刪除這一頁">🗑 刪除頁面</button>`;
  head.addEventListener('click',e=>{ const a=e.target.closest('button')?.dataset.act; if(a) pageAction(P,a); });
  wrap.append(head, cv, ov);
  if(P.el?.isConnected) P.el.replaceWith(wrap); else $('pages').append(wrap);   // 單頁重繪時原地替換
  P.el=wrap; P.canvas=cv; P.overlay=ov; P.label=head.querySelector('.pl');
  const ctx = cv.getContext('2d',{willReadFrequently:true});
  await P.page.render({canvasContext:ctx, viewport:vp, transform: dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
  if(!P.items) P.items = buildItems(P);
  if(P.pendingEdits){                                   // 開啟專案：套回原有文字的修改
    for(const e of P.pendingEdits){
      const it=P.items.find(i=>i.ri===e.ri); if(!it) continue;
      it.font0={...it.font}; Object.assign(it, e, {font:fixFont(e.font), colorSet:true});
    }
    delete P.pendingEdits;
  }
  await ensureColors(P, ctx, dpr);
  for(const it of P.items){ it.el = makeItemEl(it, P); ov.append(it.el); refreshItem(it); }
  S.objs.filter(o=>o.P===P).forEach(o=>o.type==='hl' ? mountHl(o) : mountObj(o));
  ov.addEventListener('click', e=>onPageClick(e,P));
  const cap=document.createElement('div'); cap.className='hlcap'; ov.append(cap); hlCapture(P, cap);
}

function buildItems(P){
  const out=[];
  P.raw.forEach((r,idx)=>{
    if(!r.str || !r.str.trim()) return;
    const t = r.transform;
    const st = P.styles[r.fontName]||{};
    let asc = st.ascent, desc = st.descent;
    if(!(asc>0.4 && asc<1.4)) asc = 0.88;
    if(!(desc<0 && desc>-0.6)) desc = -0.22;
    const size = Math.hypot(t[2],t[3]) || Math.hypot(t[0],t[1]);
    out.push({ id:`f${P.file.id}p${P.src}_${idx}`, ri:idx, P, str:r.str, text:r.str, t, w:r.width, size, fsz:size, fontName:r.fontName,
      asc, desc, ca:asc, cd:desc, font:fontInfo(P, r.fontName, r.str), st:stats(r.str), align:'left',
      deleted:false, color:[0,0,0], bg:[255,255,255], colorSet:false });
  });
  return out;
}

/* 從畫面取樣：背景色（邊框眾數）、文字色（離背景最遠的像素），
   並往上下延伸找出實際墨跡範圍，讓覆蓋框能完整蓋住原文字 */
async function ensureColors(P, ctx, dpr){
  if(P.items.every(it=>it.colorSet)) return;
  if(viewRot(P)===0) return sampleColors(P, ctx, dpr, P.vp);
  const vp0=P.page.getViewport({scale:S.scale*dpr, rotation:0}), c=document.createElement('canvas');
  c.width=Math.round(vp0.width); c.height=Math.round(vp0.height);
  const ctx0=c.getContext('2d',{willReadFrequently:true});
  await P.page.render({canvasContext:ctx0, viewport:vp0}).promise;
  sampleColors(P, ctx0, 1, vp0);
}
function sampleColors(P, ctx, dpr, vp){
  const W=ctx.canvas.width, H=ctx.canvas.height;
  for(const it of P.items){
    if(it.colorSet) continue;
    const g = geom(it, vp), ext = g.fs*0.45;
    const x0=Math.max(0,Math.floor((g.x-2)*dpr)), x1=Math.min(W,Math.ceil((g.x+g.w+2)*dpr));
    const y0=Math.max(0,Math.floor((g.y-ext)*dpr)), y1=Math.min(H,Math.ceil((g.y+g.h+ext)*dpr));
    const ty0=Math.max(y0,Math.floor((g.y-2)*dpr)), ty1=Math.min(y1,Math.ceil((g.y+g.h+2)*dpr));
    const w=x1-x0, h=y1-y0;
    if(w<3||ty1-ty0<3) continue;
    const d = ctx.getImageData(x0,y0,w,h).data;
    const px=(x,y)=>((y-y0)*w+x)*4;
    const buckets = new Map();
    const add=(x,y)=>{ const i=px(x,y); const k=(d[i]>>4)<<8|(d[i+1]>>4)<<4|(d[i+2]>>4);
      const b=buckets.get(k)||{n:0,r:0,g:0,b:0}; b.n++; b.r+=d[i]; b.g+=d[i+1]; b.b+=d[i+2]; buckets.set(k,b); };
    for(let x=0;x<w;x++){ add(x,ty0); add(x,ty1-1); }
    for(let y=ty0+1;y<ty1-1;y++){ add(0,y); add(w-1,y); }
    let best=null; for(const b of buckets.values()) if(!best||b.n>best.n) best=b;
    const bg=[best.r/best.n,best.g/best.n,best.b/best.n].map(Math.round);
    const dist=i=>Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2]);
    let far=0, col=[0,0,0];
    for(let y=ty0;y<ty1;y++) for(let x=0;x<w;x++){ const i=px(x,y), v=dist(i); if(v>far){ far=v; col=[d[i],d[i+1],d[i+2]]; } }
    const ink=y=>{ for(let x=0;x<w;x++) if(dist(px(x,y))>40) return true; return false; };
    let top=Math.round(g.y*dpr), bot=Math.round((g.y+g.h)*dpr);
    while(top>y0 && ink(top-1)) top--;
    while(bot<y1-1 && ink(bot)) bot++;
    const base=(g.y+g.bl)*dpr, fsd=g.fs*dpr;
    it.ca=Math.max(it.ca,(base-top+1)/fsd); it.cd=Math.min(it.cd,-(bot-base+1)/fsd);
    it.bg=bg; it.color= far>60 ? col : [0,0,0]; it.colorSet=true;
  }
}

/* ---------- 兩頁合一（像列印的「每張 2 頁」）----------
   兩頁仍是獨立頁面（可繼續編輯），只是畫面上並排在同一張紙；匯出時才真正合成一頁。
   P.mate = 下一頁（P 為左 / 上半），Q.mateOf = P */
const SHEET_M = 14.17, SHEET_G = 14.17;          // 邊界與中間間距：5mm
const pk = P => S.scale*(P.fit||1);              // 這一頁在畫面上的縮放比例
function sheetLayout(P){
  const Q=P.mate, w0=P.vp1.width, h0=P.vp1.height;
  const SW=h0, SH=w0, side=h0>=w0;               // 直式兩頁 → 橫式一張左右並排；橫式兩頁 → 直式一張上下排
  const cw = side ? (SW-2*SHEET_M-SHEET_G)/2 : SW-2*SHEET_M;
  const ch = side ? SH-2*SHEET_M : (SH-2*SHEET_M-SHEET_G)/2;
  [P,Q].forEach((X,i)=>{
    const cx = SHEET_M + (side ? i*(cw+SHEET_G) : 0), cy = SHEET_M + (side ? 0 : i*(ch+SHEET_G));
    const f=Math.min(cw/X.vp1.width, ch/X.vp1.height);
    X.fit=f; X.cell={x:cx+(cw-X.vp1.width*f)/2, y:cy+(ch-X.vp1.height*f)/2};
  });
  P.sheetDim={w:SW, h:SH};
}
const snapPx = v => { const d=window.devicePixelRatio||1; return Math.round(v*d)/d; };
function sheetEl(P){
  const Q=P.mate, k=S.scale;
  if(!P.sheet){
    const sh=document.createElement('div'); sh.className='sheet';
    sh.innerHTML=`<div class="pghead"><span class="pl"></span><span style="flex:1"></span>
      <button data-sa="up" title="往前移">↑</button><button data-sa="down" title="往後移">↓</button>
      <button data-sa="swap" title="兩頁位置對調">⇄ 對調</button>
      <button data-sa="split" title="拆回兩個獨立頁面">✂ 取消合併</button>
      <button data-sa="export" title="只匯出這一張">⬇ 匯出此張</button></div><div class="sheetin"></div>`;
    sh.querySelector('.pghead').addEventListener('click',e=>{ const a=e.target.closest('button')?.dataset.sa; if(a) sheetAction(sh._P,a); });
    P.sheet=sh;
  }
  const sh=P.sheet, inner=sh.querySelector('.sheetin'); sh._P=P;
  Object.assign(inner.style,{width:snapPx(P.sheetDim.w*k)+'px', height:snapPx(P.sheetDim.h*k)+'px'});
  // 只保留這兩頁目前的元素（重繪後舊的元素要移除）
  if(inner.children.length!==2 || inner.children[0]!==P.el || inner.children[1]!==Q.el) inner.replaceChildren(P.el, Q.el);
  for(const X of [P,Q]){
    Object.assign(X.el.style,{position:'absolute', left:snapPx(X.cell.x*k)+'px', top:snapPx(X.cell.y*k)+'px'});
  }
  return sh;
}
// 依 S.pages 順序擺放頁面與合併的紙張
function layoutPages(){
  const box=$('pages');
  for(let i=0;i<S.pages.length;i++){
    const P=S.pages[i];
    if(P.mate){ box.append(sheetEl(P)); i++; continue; }
    if(!P.el) continue;
    if(P.el.parentElement?.classList.contains('sheetin')) Object.assign(P.el.style,{position:'',left:'',top:''});
    box.append(P.el);
  }
  box.querySelectorAll('.sheet').forEach(sh=>{ if(!sh._P?.mate || sh._P.sheet!==sh) sh.remove(); });
}
// 頁面單位：合併的兩頁算一個
function units(){
  const u=[];
  for(let i=0;i<S.pages.length;i++){
    const P=S.pages[i];
    if(P.mate && S.pages[i+1]===P.mate){ u.push([P,P.mate]); i++; } else u.push([P]);
  }
  return u;
}
function moveUnit(P, d){
  const u=units(), i=u.findIndex(x=>x.includes(P)), j=i+d;
  if(j<0 || j>=u.length) return;
  [u[i],u[j]]=[u[j],u[i]];
  applyOrder(u.flat());
  (P.mateOf||P).sheet ? (P.mateOf||P).sheet.scrollIntoView({block:'nearest'}) : P.el?.scrollIntoView({block:'nearest'});
}
// 只拆開配對關係，回傳兩頁（之後需要以原比例重繪）
function breakPair(P){
  const A=P.mateOf||P, B=A.mate; if(!B) return [];
  A.sheet?.remove(); A.sheet=null;
  delete A.mate; delete B.mateOf; delete A.fit; delete B.fit; delete A.cell; delete B.cell;
  return [A,B];
}
async function rerender(list){
  for(const X of list) if(X.el && S.pages.includes(X)) await renderPage(X);
  layoutPages(); layoutThumbs(); relabel(); showSide(); status();
}
async function pairPages(P, Q){
  if(!P || !Q || P.mate || P.mateOf || Q.mate || Q.mateOf) return;
  P.mate=Q; Q.mateOf=P; sheetLayout(P);
  await rerender([P,Q]);
}
async function unpair(P){ await rerender(breakPair(P)); }
async function toggleAllPairs(){
  const any=S.pages.some(P=>P.mate);
  const touched = any ? S.pages.filter(P=>P.mate).flatMap(breakPair) : [];
  if(!any){
    for(let i=0;i+1<S.pages.length;i+=2){ const P=S.pages[i], Q=S.pages[i+1]; P.mate=Q; Q.mateOf=P; sheetLayout(P); touched.push(P,Q); }
  }
  for(const [i,X] of touched.entries()){ if(X.el) await renderPage(X); status(`重新排版… ${i+1}/${touched.length}`); }
  layoutPages(); layoutThumbs(); relabel(); showSide(); status();
}
async function sheetAction(P, a){
  if(a==='up') moveUnit(P,-1);
  else if(a==='down') moveUnit(P,1);
  else if(a==='split') unpair(P);
  else if(a==='export') exportPdf([P,P.mate]);
  else if(a==='swap'){
    const Q=P.mate; breakPair(P);
    const arr=S.pages.slice(), i=arr.indexOf(P); arr[i]=Q; arr[i+1]=P; S.pages=arr;
    Q.mate=P; P.mateOf=Q; sheetLayout(Q);
    await rerender([Q,P]);
  }
}
// 排序後若配對的兩頁不再相鄰，就自動拆開
function fixPairs(){
  const broken=[];
  S.pages.forEach((P,i)=>{ if(P.mate && S.pages[i+1]!==P.mate) broken.push(...breakPair(P)); });
  S.pages.forEach(P=>{ if(P.mateOf && !S.pages.includes(P.mateOf)) broken.push(...breakPair(P)); });
  if(broken.length) rerender(broken);
}

/* ---------- 專案檔：PDF、圖片與所有編輯存成一個 JSON ---------- */
const toB64 = bytes => new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result.slice(fr.result.indexOf(',')+1)); fr.readAsDataURL(new Blob([bytes])); });
const fromB64 = async b64 => new Uint8Array(await (await fetch('data:application/octet-stream;base64,'+b64)).arrayBuffer());
const ITEM_FIELDS = ['text','deleted','fsz','align','styled','font','color','bg','ca','cd'];
async function saveProject(){
  if(!hasDoc()) return;
  status('儲存專案中…');
  try{
    const files=[...new Set(S.pages.map(P=>P.file))], fi=new Map(files.map((f,i)=>[f,i])), pi=new Map(S.pages.map((P,i)=>[P,i]));
    const data={
      app:'pdf-editor-project', version:1, savedAt:new Date().toISOString(), scale:S.scale,
      files: await Promise.all(files.map(async f=>({name:f.name, data:await toB64(f.bytes)}))),
      pages: S.pages.map(P=>({ file:fi.get(P.file), src:P.src, rot:P.rot||0, mate:!!P.mate,
        edits:(P.items||[]).filter(isChanged).map(it=>Object.fromEntries([['ri',it.ri], ...ITEM_FIELDS.map(k=>[k,it[k]])])) })),
      objs: await Promise.all(S.objs.map(async o=>{
        const {P, el, lines, editing, bytes, url, ...rest}=o, r={...rest, page:pi.get(P)};
        if(o.type==='sig') r.bytes=await toB64(o.bytes);
        return r;
      }))
    };
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
    a.download=`${baseName()}_專案.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('已儲存專案檔。之後用「📁 開啟專案」選這個檔案，就能從目前的狀態繼續編輯。');
  }catch(e){ console.error(e); alert('儲存專案失敗：'+e.message); }
  status();
}
// 專案裡用到、但這次沒有載入的自訂字型 → 改用預設字型
function fixFont(f){
  if(!f) return f;
  if(!FONTS[f.cjkKey]) f.cjkKey='jhenghei';
  if(f.latKey!=='same' && !FONTS[f.latKey]) f.latKey='arial';
  return f;
}
async function openProject(file){
  try{
    status('開啟專案中…');
    const j=JSON.parse(await file.text());
    if(j.app!=='pdf-editor-project') throw new Error('這不是 PDF 編輯器的專案檔');
    const files=[];
    for(const [i,jf] of j.files.entries()){
      status(`開啟專案中… 檔案 ${i+1}/${j.files.length}`);
      files.push(await loadPdfBytes(await fromB64(jf.data), jf.name));
    }
    const pages=j.pages.map(jp=>{
      const P=files[jp.file].pages[jp.src];
      P.rot=jp.rot||0; P.vp1=P.page.getViewport({scale:1, rotation:viewRot(P)});
      P.pendingEdits=jp.edits||[];
      return P;
    });
    j.pages.forEach((jp,i)=>{ if(jp.mate && pages[i+1]){ pages[i].mate=pages[i+1]; pages[i+1].mateOf=pages[i]; } });
    const objs=[];
    for(const jo of j.objs){
      const o={...jo, P:pages[jo.page]}; delete o.page;
      if(!o.P) continue;
      if(o.type==='sig'){ o.bytes=await fromB64(jo.bytes); o.url=`data:image/${o.imgType==='jpg'?'jpeg':'png'};base64,${jo.bytes}`; }
      if(o.type==='text') fixFont(o.font);
      objs.push(o);
    }
    S.scale=j.scale||S.scale; $('zoom').value=String(S.scale);
    showDoc(files, pages);
    S.objs=objs;
    await renderAll();
    showSide(); status(); buildThumbs();
  }catch(e){ console.error(e); alert('無法開啟專案：'+e.message); status(); }
}

/* ---------- 頁面管理：排序 / 刪除 / 單頁匯出 ---------- */
const pageNo = P => S.pages.indexOf(P)+1;
function relabel(){
  const n=S.pages.length, U=units();
  S.pages.forEach((P,i)=>{
    if(P.label){
      P.label.textContent=`第 ${i+1} 頁`+(P.rot?`（已旋轉 ${P.rot>180?P.rot-360:P.rot}°）`:'');
      if(S.files.length>1){ const t=document.createElement('span'); t.className='plf'; t.style.color=P.file.color;
        t.textContent=` · ${P.file.name} p.${P.src+1}`; P.label.append(t); }
    }
    const u=U.findIndex(x=>x.includes(P));
    if(P.el){
      P.el.querySelector('[data-act=up]').disabled = u===0;
      P.el.querySelector('[data-act=down]').disabled = u===U.length-1;
      P.el.querySelector('[data-act=del]').disabled = n===1;
      const nx=S.pages[i+1];
      P.el.querySelector('[data-act=merge]').disabled = !nx || !!nx.mate || !!nx.mateOf;
    }
    if(P.mate && P.sheet){
      const h=P.sheet.querySelector('.pghead');
      h.querySelector('.pl').textContent=`第 ${i+1}–${i+2} 頁 · 兩頁合一`;
      h.querySelector('[data-sa=up]').disabled = u===0;
      h.querySelector('[data-sa=down]').disabled = u===U.length-1;
    }
    if(P.thumbN) P.thumbN.textContent = (i+1) + (P.mate||P.mateOf ? ' ⧉' : '');
    P.thumb?.classList.toggle('pa', !!P.mate);
    P.thumb?.classList.toggle('pb', !!P.mateOf);
  });
  $('bPair').textContent = S.pages.some(P=>P.mate) ? '⧉ 取消全部合併' : '⧉ 整份兩頁合一';
}
function applyOrder(order){
  S.pages=order;
  fixPairs(); layoutPages();
  layoutThumbs(); relabel(); showSide(); status();
}
function deletePage(P){
  if(S.pages.length<=1) return alert('至少要保留一頁');
  if(!confirm(`確定要刪除第 ${pageNo(P)} 頁？\n此頁上的修改、簽名、文字框與符號也會一併移除。`)) return;
  if(S.sel?.P===P) S.sel=null;
  const other=breakPair(P).filter(x=>x!==P);
  S.pages=S.pages.filter(x=>x!==P);
  S.objs=S.objs.filter(o=>o.P!==P);
  P.el?.remove(); P.thumb?.remove(); P.thumb=null;
  if(other.length) rerender(other); else { layoutPages(); layoutThumbs(); relabel(); showSide(); status(); }
}
function pageAction(P, act){
  const i=S.pages.indexOf(P);
  if(act==='up') moveUnit(P,-1);
  else if(act==='down') moveUnit(P,1);
  else if(act==='merge') pairPages(P, S.pages[i+1]);
  else if(act==='export') exportPdf([P]);
  else if(act==='del') deletePage(P);
  else if(act==='rotl') rotatePages([P],-90);
  else if(act==='rotr') rotatePages([P],90);
}
/* 旋轉頁面：新增的物件跟著頁面移動（圖片一起轉，文字框與符號保持正向） */
async function rotatePages(list, d){
  for(const P of list){
    const old=P.vp1;
    P.rot=((P.rot||0)+d+360)%360;
    P.vp1=P.page.getViewport({scale:1, rotation:viewRot(P)});
    P.lines=null;
    for(const o of S.objs.filter(o=>o.P===P && o.type!=='hl')){   // 螢光筆以 PDF 座標記錄，不需換算
      const [px,py]=old.convertToPdfPoint(o.x+o.w/2, o.y+o.h/2), [nx,ny]=P.vp1.convertToViewportPoint(px,py);
      o.x=nx-o.w/2; o.y=ny-o.h/2;
      if(o.type==='sig') o.rot=normAngle((o.rot||0)+d);
    }
    P.tm=null;
    renderThumb(P);
  }
  // 合併中的頁面旋轉後要重新排版，另一半也一起重繪
  const redo=new Set(list);
  S.pages.forEach(P=>{ if(P.mate && (redo.has(P)||redo.has(P.mate))){ sheetLayout(P); redo.add(P); redo.add(P.mate); } });
  for(const P of redo) if(P.el) await renderPage(P);
  layoutPages(); relabel(); showSide(); status();
}
/* ---------- 文字繪製（預覽） ---------- */
function cssFont(it, kind, fs){
  const key = runKey(it, kind), f = FONTS[key];
  return `${it.font.italic?'italic ':''}${it.font.bold?'bold ':''}${fs}px "PE_${key}",${f.css}`;
}
function drawRuns(ctx, text, it, fs, x, by, fill){
  ctx.textBaseline='alphabetic';
  if(fill) ctx.fillStyle=fill;
  for(const r of splitRuns(text)){
    ctx.font = cssFont(it, r.kind, fs);
    if(fill) ctx.fillText(r.s, x, by);
    x += ctx.measureText(r.s).width;
  }
  return x;
}
const alignOffset = (align, boxW, textW) => align==='center' ? (boxW-textW)/2 : align==='right' ? boxW-textW : 0;
const rgbCss = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const toHex = c => '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
const fromHex = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const isChanged = it => !!(it.deleted || it.text!==it.str || it.fsz!==it.size || it.align!=='left' || it.styled);

function makeItemEl(it, P){
  const el=document.createElement('div'); el.className='ti';
  placeBox(el, geom(it,P.vp));
  el.title = it.str;
  el.addEventListener('click',e=>{ if(S.pending) return; e.stopPropagation(); select(it); });
  el.addEventListener('dblclick',e=>{ if(S.pending) return; e.stopPropagation(); startInline(it); });
  return el;
}

function refreshItem(it){
  const el=it.el; if(!el || !el.isConnected) return;
  const g=geom(it,it.P.vp), ch=isChanged(it);
  el.classList.toggle('changed', ch && !it.deleted);
  el.classList.toggle('deleted', it.deleted);
  el.classList.toggle('sel', S.sel===it);
  el.innerHTML='';
  el.style.background = ch ? rgbCss(it.bg) : '';
  if(!ch || it.deleted || !it.text) return;
  const dpr=window.devicePixelRatio||1;
  const fs=g.fs*it.fsz/it.size, pad=fs*0.35;
  const c=document.createElement('canvas'), ctx=c.getContext('2d');
  const tw=drawRuns(ctx,it.text,it,fs,0,0,null);
  const off=alignOffset(it.align,g.w,tw);
  // 將畫布對齊到裝置像素格線，文字才不會被重新取樣而模糊（旋轉中的文字無法對齊，略過）
  const r=el.getBoundingClientRect();
  const left= g.ang ? Math.min(0,off)-2 : Math.round((r.left+Math.min(0,off)-2)*dpr)/dpr - r.left;
  const top = g.ang ? -pad : Math.round((r.top-pad)*dpr)/dpr - r.top;
  const W=Math.ceil((Math.max(g.w,off+tw)-left+2)*dpr), H=Math.ceil((g.h+pad*2)*dpr);
  c.width=W; c.height=H; c.style.width=W/dpr+'px'; c.style.height=H/dpr+'px';
  c.style.left=left+'px'; c.style.top=top+'px';
  ctx.scale(dpr,dpr);
  drawRuns(ctx,it.text,it,fs,off-left,g.bl-top,rgbCss(it.color));
  el.append(c);
}

/* ---------- 選取 / 編輯原有文字 ---------- */
const redraw = x => x.type ? drawObj(x) : refreshItem(x);
function select(x){
  const prev=S.sel; S.sel=x;
  if(prev && prev!==x) redraw(prev);
  if(x) redraw(x);
  showSide();
}

const ALIGN_ICONS = {
  left:  '<svg width="16" height="14" viewBox="0 0 16 14" fill="currentColor"><rect y="1" width="16" height="2"/><rect y="6" width="10" height="2"/><rect y="11" width="13" height="2"/></svg>',
  center:'<svg width="16" height="14" viewBox="0 0 16 14" fill="currentColor"><rect y="1" width="16" height="2"/><rect x="3" y="6" width="10" height="2"/><rect x="1.5" y="11" width="13" height="2"/></svg>',
  right: '<svg width="16" height="14" viewBox="0 0 16 14" fill="currentColor"><rect y="1" width="16" height="2"/><rect x="6" y="6" width="10" height="2"/><rect x="3" y="11" width="13" height="2"/></svg>'
};
const ALIGN_LABEL = {left:'靠左', center:'置中', right:'靠右'};
const alignButtons = it => ['left','center','right'].map(a=>
  `<button type="button" data-a="${a}" class="${it.align===a?'on':''}" title="${ALIGN_LABEL[a]}對齊">${ALIGN_ICONS[a]}${ALIGN_LABEL[a]}</button>`).join('');

function startInline(it){
  select(it);
  const P=it.P, g=geom(it,P.vp), fs=g.fs*it.fsz/it.size;
  const box=document.createElement('div'); box.className='inl';
  Object.assign(box.style,{left:g.x+'px',top:g.y+'px',transformOrigin:`0 ${g.bl}px`,transform:g.ang?`rotate(${g.ang}rad)`:''});
  box.innerHTML=`<div class="itb">${alignButtons(it)}</div><input>`;
  const inp=box.querySelector('input');
  inp.value = it.deleted ? '' : it.text;
  const fit=()=>{ inp.style.width='0px'; inp.style.width=Math.max(g.w+8, inp.scrollWidth+8)+'px'; };
  Object.assign(inp.style,{height:(g.h+4)+'px', font:cssFont(it, CJK_RE.test(it.text)?'cjk':'latin', fs), textAlign:it.align});
  box.querySelectorAll('.itb button').forEach(b=>{
    b.addEventListener('mousedown',e=>e.preventDefault());   // 不讓輸入框失去焦點
    b.addEventListener('click',e=>{ e.stopPropagation(); it.align=b.dataset.a; inp.style.textAlign=it.align;
      box.querySelectorAll('.itb button').forEach(x=>x.classList.toggle('on',x===b)); showSide(); });
  });
  P.overlay.append(box); fit(); inp.focus(); inp.select();
  let done=false; const origAlign=it.align;
  const fin=ok=>{ if(done) return; done=true;
    if(ok){ it.text=inp.value.replace(/[\r\n]+/g,' '); it.deleted=false; } else it.align=origAlign;
    box.remove(); refreshItem(it); showSide(); status(); };
  inp.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') fin(true); if(e.key==='Escape') fin(false); });
  inp.addEventListener('input',fit);
  inp.addEventListener('blur',()=>fin(true));
  box.addEventListener('click',e=>e.stopPropagation());
  box.addEventListener('dblclick',e=>e.stopPropagation());
}

/* ---------- 新增物件：簽名 / 文字框 / 符號 ---------- */
const MARK_CHECK = 'M6 54 L20 40 L40 60 L82 16 L96 30 L40 88 Z';
const MARK_LABEL = {check:'✓ 勾勾', square:'■ 方塊', circle:'● 圓點'};
function markSvg(shape, color){
  const inner = shape==='check' ? `<path d="${MARK_CHECK}"/>` : shape==='square' ? '<rect width="100" height="100"/>' : '<circle cx="50" cy="50" r="50"/>';
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" fill="${color}">${inner}</svg>`;
}
const TB_PAD = 2;                       // 文字框內距（pt）
const lineH = o => o.size*1.35;
const baseOff = (o,i) => TB_PAD + i*lineH(o) + (lineH(o)-o.size)/2 + 0.88*o.size;  // 第 i 行基線離框頂的距離

/* 自動換行：預覽與匯出共用同一份斷行結果 */
function layoutText(o){
  const ctx = layoutText.ctx || (layoutText.ctx=document.createElement('canvas').getContext('2d'));
  const maxW = Math.max(1, o.w-TB_PAD*2), width = s => drawRuns(ctx,s,o,o.size,0,0,null), out=[];
  for(const para of o.text.split('\n')){
    const toks = para.match(/[A-Za-z0-9À-ɏ'’.,:;!?%&@#$()\-\/]+|\s+|[\s\S]/gu) || [''];
    let line='';
    for(const t of toks){
      if(line && width(line+t)>maxW){ out.push(line.replace(/\s+$/,'')); line=/^\s+$/.test(t)?'':t; }
      else line+=t;
      while([...line].length>1 && width(line)>maxW){          // 單一長字串硬切
        const ch=[...line]; let n=ch.length;
        while(n>1 && width(ch.slice(0,n).join(''))>maxW) n--;
        out.push(ch.slice(0,n).join('')); line=ch.slice(n).join('');
      }
    }
    out.push(line);
  }
  return o.lines=out;
}

function posObj(o){
  const k=pk(o.P);
  Object.assign(o.el.style,{left:o.x*k+'px',top:o.y*k+'px',width:o.w*k+'px',height:o.h*k+'px',
    transform:o.rot?`rotate(${o.rot}deg)`:''});
}
function drawObj(o){
  if(o.type==='hl') return drawHl(o);
  const el=o.el; if(!el || !el.isConnected) return;
  if(o.type==='text') o.h = layoutText(o).length*lineH(o) + TB_PAD*2;
  posObj(o);
  el.classList.toggle('sel', S.sel===o);
  const body=el.querySelector('.obj-body');
  if(o.type==='sig') body.innerHTML=`<img src="${o.url}" alt="簽名">`;
  else if(o.type==='mark') body.innerHTML=markSvg(o.shape, rgbCss(o.color));
  else if(!o.editing) drawTextObj(o, body);
}
function drawTextObj(o, body){
  body.innerHTML='';
  if(!o.text){ body.innerHTML='<span class="ph">雙擊輸入文字</span>'; return; }
  const k=pk(o.P), dpr=window.devicePixelRatio||1, fs=o.size*k;
  const r=body.getBoundingClientRect();
  const left=Math.round(r.left*dpr)/dpr-r.left, top=Math.round(r.top*dpr)/dpr-r.top;
  const c=document.createElement('canvas');
  c.width=Math.ceil((o.w*k+4)*dpr); c.height=Math.ceil((o.h*k+4)*dpr);
  c.style.width=c.width/dpr+'px'; c.style.height=c.height/dpr+'px'; c.style.left=left+'px'; c.style.top=top+'px';
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.translate(-left,-top);
  const innerW=(o.w-TB_PAD*2)*k;
  o.lines.forEach((ln,i)=>{
    const tw=drawRuns(ctx,ln,o,fs,0,0,null);
    drawRuns(ctx, ln, o, fs, TB_PAD*k+alignOffset(o.align,innerW,tw), baseOff(o,i)*k, rgbCss(o.color));
  });
  body.append(c);
}
function mountObj(o){
  const el=document.createElement('div'); el.className='obj '+o.type; o.el=el;
  el.innerHTML='<div class="obj-body"></div><button class="obj-del" title="刪除">×</button><span class="obj-rs" title="拖曳調整大小"></span>'
    + (o.type==='sig' ? '<span class="obj-rot" title="拖曳旋轉（按住 Shift 以 15° 為一格）"></span>' : '');
  o.P.overlay.append(el);
  drawObj(o);
  el.querySelector('.obj-del').onclick=e=>{ e.stopPropagation(); removeObj(o); };
  el.addEventListener('pointerdown',e=>{
    if(o.editing || e.target.closest('.obj-del')) return;
    e.preventDefault(); e.stopPropagation();
    const k=pk(o.P), rs=e.target.classList.contains('obj-rs'), rot=e.target.classList.contains('obj-rot');
    const sx=e.clientX, sy=e.clientY, s0={x:o.x,y:o.y,w:o.w,h:o.h};
    const snap = !rs && !rot ? snapTargets(o) : null;
    el.setPointerCapture(e.pointerId);
    const mv=ev=>{
      const dx=(ev.clientX-sx)/k, dy=(ev.clientY-sy)/k;
      if(rot){                                  // 以圖片中心為軸旋轉
        const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
        let a=Math.atan2(ev.clientY-cy, ev.clientX-cx)*180/Math.PI+90;
        a = ev.shiftKey ? Math.round(a/15)*15 : (Math.abs(a-Math.round(a/90)*90)<4 ? Math.round(a/90)*90 : Math.round(a));
        o.rot=normAngle(a); posObj(o); if(S.sel===o) syncRotInput(o); return;
      }
      if(!rs){ o.x=s0.x+dx; o.y=s0.y+dy; if(!ev.altKey) applySnap(o,snap); else hideGuides(o.P); posObj(o); return; }
      if(o.type==='text'){ o.w=Math.max(20,s0.w+dx); drawObj(o); return; }
      const a=(o.rot||0)*Math.PI/180, dl=dx*Math.cos(a)+dy*Math.sin(a);   // 沿圖片自身的方向縮放
      if(o.type==='sig'){ o.w=Math.max(15,s0.w+dl); o.h=o.w*o.ratio; }
      else o.w=o.h=Math.max(4,s0.w+Math.max(dx,dy));
      if(o.rot){ o.x=s0.x+(s0.w-o.w)/2; o.y=s0.y+(s0.h-o.h)/2; }        // 旋轉後以中心縮放
      posObj(o);
    };
    const up=()=>{
      el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up);
      hideGuides(o.P);
      if(o.type==='text') drawObj(o);           // 重新對齊像素格線
      if(S.sel===o) showSide();
    };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
  });
  el.addEventListener('click',e=>{ e.stopPropagation(); if(S.sel!==o) select(o); });
  el.addEventListener('dblclick',e=>{ e.stopPropagation(); if(o.type==='text') editText(o); });
}
/* ---------- 對齊、吸附、旋轉 ---------- */
const normAngle = a => { a=((a%360)+360)%360; return a>180 ? a-360 : a; };
// 物件（含旋轉後）的外框，單位 pt
function bbox(o){
  const r=(o.rot||0)*Math.PI/180, c=Math.abs(Math.cos(r)), si=Math.abs(Math.sin(r));
  const w=o.w*c+o.h*si, h=o.w*si+o.h*c, cx=o.x+o.w/2, cy=o.y+o.h/2;
  return {x:cx-w/2, y:cy-h/2, w, h, cx, cy};
}
function moveBBox(o, nx, ny){ const b=bbox(o); o.x+=nx-b.x; o.y+=ny-b.y; }

/* 從算繪好的頁面找出水平 / 垂直框線（排除文字區域），結果以 pt 為單位快取 */
function detectLines(P){
  if(P.lines) return P.lines;
  const c=P.canvas, W=c.width, H=c.height, k=W/P.vp1.width;
  const d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
  const dark=new Uint8Array(W*H);
  for(let i=0,j=0;j<W*H;i+=4,j++) dark[j] = d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11 < 160 ? 1 : 0;
  const textBoxes=(P.items||[]).map(it=>{ const b=geomAABB(geom(it,P.vp1)); return [b[0]+1,b[1]+1,b[2]-1,b[3]-1]; });
  const inText=(x,y)=>textBoxes.some(b=>x>b[0]&&x<b[2]&&y>b[1]&&y<b[3]);
  const gap=Math.round(1.5*k)+1, off=Math.round(3*k)+2;
  // 掃描一個方向：along=沿線方向長度，across=另一方向長度，at(a,b) 取像素
  function scan(along, across, at, minLen){
    const segs=[];
    for(let b=0;b<across;b++){
      let a=0;
      while(a<along){
        if(!at(a,b)){ a++; continue; }
        const a0=a; let miss=0;
        while(a<along && (at(a,b) || miss<gap)){ miss = at(a,b) ? 0 : miss+1; a++; }
        const a1=a-miss;
        if(a1-a0<minLen) continue;
        let thick=0, n=0;                       // 線條要細：兩側一段距離外不能也是深色
        for(let t=a0;t<a1;t+=3){ n++; if(b-off>=0 && b+off<across && at(t,b-off) && at(t,b+off)) thick++; }
        if(thick/n<0.3) segs.push({b,a0,a1});
      }
    }
    // 相鄰列合併成一條線（粗線會佔好幾列）
    const lines=[];
    for(const sg of segs){
      const L=lines.find(l=>sg.b-l.b1<=1 && Math.min(l.a1,sg.a1)-Math.max(l.a0,sg.a0) > 0.5*Math.min(l.a1-l.a0,sg.a1-sg.a0));
      if(L){ L.b1=sg.b; L.a0=Math.min(L.a0,sg.a0); L.a1=Math.max(L.a1,sg.a1); }
      else lines.push({b0:sg.b,b1:sg.b,a0:sg.a0,a1:sg.a1});
    }
    return lines.map(l=>({pos:(l.b0+l.b1+1)/2/k, t:(l.b1-l.b0+1)/k, from:l.a0/k, to:l.a1/k}));
  }
  const h=scan(W,H,(x,y)=>dark[y*W+x],20*k).filter(l=>!inText((l.from+l.to)/2,l.pos));
  const v=scan(H,W,(y,x)=>dark[y*W+x],12*k).filter(l=>!inText(l.pos,(l.from+l.to)/2));
  return P.lines={h,v};
}
// 找出點 (cx,cy) 所在的框格；只有底線時以底線的左右端為範圍
function findCell(P, cx, cy){
  const L=detectLines(P), m=2;
  let l=null, r=null, t=null, b=null;
  for(const v of L.v){ if(v.from-m>cy || v.to+m<cy) continue;
    if(v.pos<=cx && (!l || v.pos>l.pos)) l=v; if(v.pos>=cx && (!r || v.pos<r.pos)) r=v; }
  for(const h of L.h){ if(h.from-m>cx || h.to+m<cx) continue;
    if(h.pos<=cy && (!t || h.pos>t.pos)) t=h; if(h.pos>=cy && (!b || h.pos<b.pos)) b=h; }
  if(!l && !r && !t && !b) return null;
  const hl=b||t, vl=l||r;
  return {
    x0: l ? l.pos+l.t/2 : hl ? hl.from : 0,  x1: r ? r.pos-r.t/2 : hl ? hl.to : P.vp1.width,
    y0: t ? t.pos+t.t/2 : vl ? vl.from : 0,  y1: b ? b.pos-b.t/2 : vl ? vl.to : P.vp1.height };
}
function flashRect(P, R){
  const k=pk(P), el=document.createElement('div'); el.className='cellflash';
  Object.assign(el.style,{left:R.x0*k+'px',top:R.y0*k+'px',width:(R.x1-R.x0)*k+'px',height:(R.y1-R.y0)*k+'px'});
  P.overlay.append(el);
  setTimeout(()=>el.style.opacity='0',700); setTimeout(()=>el.remove(),1400);
}
const otherImages = o => S.objs.filter(x=>x!==o && x.P===o.P && x.type==='sig');
function alignTarget(o){
  const P=o.P;
  if(S.alignBase==='page') return {x0:0, y0:0, x1:P.vp1.width, y1:P.vp1.height};
  if(S.alignBase==='frame'){
    const b=bbox(o), c=findCell(P,b.cx,b.cy);
    if(!c) toast('物件附近找不到框線。請先把它拖到要對齊的格子裡，再按對齊。');
    return c;
  }
  const ref=S.alignRef;
  if(!ref || ref.P!==P || ref===o){ toast('這一頁沒有其他圖片可以對齊'); return null; }
  const rb=bbox(ref); return {x0:rb.x, y0:rb.y, x1:rb.x+rb.w, y1:rb.y+rb.h};
}
function alignObj(o, how){
  const T=alignTarget(o); if(!T) return;
  if(how==='fit'){                              // 等比例縮放到剛好放進框內，再置中
    const pad=S.alignBase==='frame'?1:0, b=bbox(o);
    const f=Math.min((T.x1-T.x0-pad*2)/b.w, (T.y1-T.y0-pad*2)/b.h), cx=b.cx, cy=b.cy;
    o.w*=f; o.h*=f; o.x=cx-o.w/2; o.y=cy-o.h/2;
    const nb=bbox(o); moveBBox(o,(T.x0+T.x1-nb.w)/2,(T.y0+T.y1-nb.h)/2);
  }else{
    const b=bbox(o); let nx=b.x, ny=b.y;
    if(how==='l') nx=T.x0; else if(how==='ch') nx=(T.x0+T.x1-b.w)/2; else if(how==='r') nx=T.x1-b.w;
    else if(how==='t') ny=T.y0; else if(how==='cv') ny=(T.y0+T.y1-b.h)/2; else if(how==='b') ny=T.y1-b.h;
    moveBBox(o,nx,ny);
  }
  drawObj(o); flashRect(o.P,T); showSide();
}
/* 拖曳吸附：頁面邊緣與中線、底圖框線、其他圖片 */
function snapTargets(o){
  if(!S.snap) return null;
  const P=o.P, W=P.vp1.width, H=P.vp1.height, xs=[0,W/2,W], ys=[0,H/2,H];
  const L=detectLines(P);
  L.v.forEach(v=>xs.push(v.pos-v.t/2, v.pos+v.t/2));
  L.h.forEach(h=>ys.push(h.pos-h.t/2, h.pos+h.t/2));
  S.objs.filter(x=>x!==o && x.P===P && (x.type==='sig'||x.type==='mark')).forEach(x=>{ const b=bbox(x); xs.push(b.x,b.cx,b.x+b.w); ys.push(b.y,b.cy,b.y+b.h); });
  return {xs,ys};
}
function applySnap(o, T){
  hideGuides(o.P);
  if(!T) return;
  const thr=6/pk(o.P), b=bbox(o);
  const best=(edges,targets)=>{ let r=null; for(const e of edges) for(const t of targets){ const d=t-e; if(Math.abs(d)<thr && (!r || Math.abs(d)<Math.abs(r.d))) r={d,t}; } return r; };
  const bx=best([b.x,b.cx,b.x+b.w],T.xs), by=best([b.y,b.cy,b.y+b.h],T.ys);
  if(bx){ o.x+=bx.d; showGuide(o.P,'v',bx.t); }
  if(by){ o.y+=by.d; showGuide(o.P,'h',by.t); }
}
function showGuide(P, dir, pos){
  const g=document.createElement('div'); g.className='guide '+dir;
  g.style[dir==='v'?'left':'top']=pos*pk(P)+'px';
  P.overlay.append(g);
}
const hideGuides = P => P.overlay.querySelectorAll('.guide').forEach(g=>g.remove());

/* 文字框字型：讀取頁面字體 / 標楷體 / 微軟正黑體 */
function pageFonts(P){
  const seen=new Set(), out=[];
  for(const [fn,c] of Object.entries(P.fontCache||{})){
    if(seen.has(c.name)) continue; seen.add(c.name);
    const f=fontInfo(P,fn,''), map=f.latKey==='same' ? FONTS[f.cjkKey].label : `英數 ${FONTS[f.latKey].label}／中文 ${FONTS[f.cjkKey].label}`;
    out.push({v:'pf:'+fn, label:`頁面字體：${c.name}（${map}）`});
  }
  return out;
}
function defaultTextFont(P){
  const cnt={};
  for(const r of P.raw) if(r.fontName && r.str?.trim()) cnt[r.fontName]=(cnt[r.fontName]||0)+r.str.length;
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  return top ? 'pf:'+top[0] : 'jhenghei';
}
function setTextFont(o, sel){
  o.fontSel=sel;
  if(sel.startsWith('pf:')) o.font={...fontInfo(o.P, sel.slice(3), '')};
  else o.font={name:FONTS[sel].label, cjkKey:sel, latKey:'same', bold:!!o.font?.bold, italic:!!o.font?.italic};
}

/* ---------- 圖片 / 簽名 ---------- */
// w0：放置時的預設寬度（pt），簽名小一點、照片大一點
function placeSig(url, bytes, imgType, w0=140){
  const img=new Image();
  img.onload=()=>beginPlace({type:'sig', url, bytes, imgType, w0, ratio:img.naturalHeight/img.naturalWidth});
  img.src=url;
}
const MAX_IMG = 2400;   // 長邊上限（px），避免照片讓 PDF 過大
async function loadSigFile(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const isPng=buf[0]===0x89&&buf[1]===0x50, isJpg=buf[0]===0xFF&&buf[1]===0xD8;
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onerror=()=>alert('無法讀取此圖檔格式（例如 HEIC），請先轉成 JPG 或 PNG');
  img.onload=()=>{
    const W=img.naturalWidth, H=img.naturalHeight, big=Math.max(W,H)>MAX_IMG;
    const w0 = isPng && !big ? 140 : 200;
    // PNG 且尺寸合理 → 原檔嵌入（保留透明）
    if(isPng && !big) return placeSig(url, buf, 'png', w0);
    // 其餘都經過畫布：JPG 依 EXIF 轉正、過大的縮小、其他格式轉檔
    const k=big ? MAX_IMG/Math.max(W,H) : 1, c=document.createElement('canvas');
    c.width=Math.round(W*k); c.height=Math.round(H*k);
    const ctx=c.getContext('2d');
    if(isJpg){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); }
    ctx.drawImage(img,0,0,c.width,c.height);
    const du = isJpg ? c.toDataURL('image/jpeg',0.92) : c.toDataURL('image/png');
    placeSig(du, dataUrlBytes(du), isJpg?'jpg':'png', w0);
  };
  img.src=url;
}
function dataUrlBytes(du){ const b=atob(du.split(',')[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }

/* 手寫板 */
const pad=$('pad'); let padCtx, drawing=false, last=null, padDirty=false;
function openPad(){
  $('padModal').style.display='flex';
  const dpr=window.devicePixelRatio||1, W=Math.min(640, window.innerWidth-64), H=240;
  pad.width=W*dpr; pad.height=H*dpr; pad.style.width=W+'px'; pad.style.height=H+'px';
  padCtx=pad.getContext('2d'); padCtx.scale(dpr,dpr); padCtx.lineCap=padCtx.lineJoin='round'; padDirty=false;
}
pad.addEventListener('pointerdown',e=>{ drawing=true; pad.setPointerCapture(e.pointerId); last=[e.offsetX,e.offsetY]; });
pad.addEventListener('pointermove',e=>{
  if(!drawing) return;
  padCtx.strokeStyle=$('padColor').value; padCtx.lineWidth=+$('padW').value;
  padCtx.beginPath(); padCtx.moveTo(...last); padCtx.lineTo(e.offsetX,e.offsetY); padCtx.stroke();
  last=[e.offsetX,e.offsetY]; padDirty=true;
});
pad.addEventListener('pointerup',()=>drawing=false);
$('padClear').onclick=()=>{ padCtx.clearRect(0,0,pad.width,pad.height); padDirty=false; };
$('padCancel').onclick=()=>$('padModal').style.display='none';
$('padOk').onclick=()=>{
  if(!padDirty) return alert('請先簽名');
  const d=padCtx.getImageData(0,0,pad.width,pad.height).data; let x0=pad.width,y0=pad.height,x1=0,y1=0;
  for(let y=0;y<pad.height;y++) for(let x=0;x<pad.width;x++) if(d[(y*pad.width+x)*4+3]>0){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const p=8, c=document.createElement('canvas'); c.width=x1-x0+p*2; c.height=y1-y0+p*2;
  c.getContext('2d').drawImage(pad,x0-p,y0-p,c.width,c.height,0,0,c.width,c.height);
  const du=c.toDataURL('image/png');
  $('padModal').style.display='none';
  placeSig(du, dataUrlBytes(du), 'png');
};
