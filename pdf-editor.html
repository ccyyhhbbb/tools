let customN=0;
async function addFont(file){
  if(/\.ttc$/i.test(file.name)) return alert('不支援 .ttc 字型集合，請使用 .ttf 或 .otf');
  const bytes=new Uint8Array(await file.arrayBuffer());
  const key='custom'+(++customN), id=key+'_r';
  let label=file.name.replace(/\.(ttf|otf)$/i,'');
  try{ const fk=fontkit.create(bytes); label=fk.familyName||label; }catch(e){ return alert('字型檔無法解析：'+e.message); }
  FontFiles[id]=bytes;
  FONTS[key]={label:label+'（自訂）', custom:true, css:'sans-serif', files:{r:id}};
  registerFace(key,'r',bytes);
  showSide();
  toast(`已加入字型「${esc(label)}」，可在右側字型選單中選用`);
}

/* ---------- 匯出 ---------- */
function stdName(base, b, i){
  const it = base==='TimesRoman' ? 'Italic' : 'Oblique';
  return base + (b&&i ? 'Bold'+it : b ? 'Bold' : i ? it : '');
}
function rasterRun(text, it, key, size){
  const k=12, fs=size*k, c=document.createElement('canvas'), ctx=c.getContext('2d');
  const font=`${it.font.italic?'italic ':''}${it.font.bold?'bold ':''}${fs}px "PE_${key}",${FONTS[key].css}`;
  ctx.font=font;
  const w=Math.ceil(ctx.measureText(text).width)+2;
  c.width=w; c.height=Math.ceil(fs*1.5);
  ctx.font=font; ctx.textBaseline='alphabetic'; ctx.fillStyle=rgbCss(it.color);
  ctx.fillText(text,0,fs*1.15);
  return { url:c.toDataURL('image/png'), w:w/k, h:c.height/k, below:(c.height-fs*1.15)/k };
}
// 畫面座標（scale 1）的方框 → PDF 座標
function pdfRect(P, x, y, w, h){
  const [ax,ay]=P.vp1.convertToPdfPoint(x,y+h), [bx,by]=P.vp1.convertToPdfPoint(x+w,y);
  return { x:Math.min(ax,bx), y:Math.min(ay,by), width:Math.abs(bx-ax), height:Math.abs(by-ay) };
}

// 網站版沒有 fonts/ 資料夾，優先讀使用者電腦的字型；本機 file:// 版優先用 fonts/
const preferLocal = location.protocol!=='file:';
/* only：只匯出指定的頁面（陣列）；不給則依目前順序匯出全部頁面 */
async function exportPdf(only){
  if(preferLocal) getLocalFonts();   // 必須在點擊當下呼叫，瀏覽器才會跳出權限詢問
  const list = Array.isArray(only) ? only : S.pages;
  const btn=$('bExport'); btn.disabled=true; status('匯出中…（首次使用字型需要載入）');
  const {PDFDocument, rgb, degrees, pushGraphicsState, popGraphicsState, setTextRenderingMode,
         TextRenderingMode, setLineWidth, setStrokingColor, BlendMode} = PDFLib;
  const missing=new Set();
  try{
    // 每個來源檔分別套用編輯（字型嵌入在各自的文件裡）
    async function editFile(file, pages){
    const doc = await PDFDocument.load(file.bytes, {ignoreEncryption:true});
    doc.registerFontkit(fontkit);
    const embedded={};
    // 依字型目錄取得 PDF 字型；回傳 null 代表只能用圖像
    async function resolve(key, bold, italic){
      const f=FONTS[key], v=pickVariant(key,bold,italic);
      let src=null;
      if(v && !preferLocal) try{ src={...v, id:v.file, bytes:await loadFontFile(v.file)}; }catch(e){}
      if(!src) try{ src=await localFontBytes(key,bold,italic); }catch(e){ console.warn(e); }
      if(!src && v && preferLocal) try{ src={...v, id:v.file, bytes:await loadFontFile(v.file)}; }catch(e){}
      if(src){
        try{
          registerFace(key, src.v, src.bytes);
          embedded[src.id] = embedded[src.id] || await doc.embedFont(src.bytes,{subset:true});
          return { font:embedded[src.id], fauxBold:src.fauxBold, fauxItalic:src.fauxItalic };
        }catch(e){ console.warn(e); }
      }
      if(f.family||f.files) missing.add(f.label);
      if(f.std){ const n=stdName(f.std,bold,italic); embedded[n]=embedded[n]||await doc.embedFont(PDFLib.StandardFonts[n]); return {font:embedded[n]}; }
      return null;
    }
    // 畫一行文字（中文 / 英數分段用各自字型），(x,by) 為基線起點、ang 為書寫方向（度，逆時針）
    async function drawLine(pg, text, o, x, by, sz, boxW, align, ang=0){
      const col=rgb(...o.color.map(v=>v/255)), runs=[];
      for(const run of splitRuns(text)){
        const key=runKey(o,run.kind), rf=await resolve(key,o.font.bold,o.font.italic);
        if(rf){   // PDF 內建字型無法編碼中文時會丟例外 → 改用圖像
          let ok=true; try{ rf.font.encodeText(run.s); }catch(e){ ok=false; }
          if(ok){ runs.push({s:run.s, rf, w:rf.font.widthOfTextAtSize(run.s,sz)}); continue; }
        }
        const r=rasterRun(run.s,o,key,sz); runs.push({s:run.s, img:r, w:r.w});
      }
      const a=ang*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a);
      let t = alignOffset(align, boxW, runs.reduce((acc,r)=>acc+r.w,0));
      for(const r of runs){
        const px=x+ux*t, py=by+uy*t;
        if(r.img){
          pg.drawImage(await doc.embedPng(r.img.url),{x:px+uy*r.img.below, y:py-ux*r.img.below, width:r.img.w, height:r.img.h, rotate:degrees(ang)});
        }else{
          if(r.rf.fauxBold) pg.pushOperators(pushGraphicsState(), setTextRenderingMode(TextRenderingMode.FillAndOutline),
                                             setLineWidth(sz*0.035), setStrokingColor(col));
          pg.drawText(r.s,{x:px,y:py,size:sz,font:r.rf.font,color:col, rotate:degrees(ang),
            ...(r.rf.fauxItalic?{xSkew:degrees(0),ySkew:degrees(12)}:{})});
          if(r.rf.fauxBold) pg.pushOperators(popGraphicsState());
        }
        t+=r.w;
      }
    }
    const pdfPages=doc.getPages();
    for(const P of pages){
      const pg=pdfPages[P.src], R=viewRot(P);   // R：頁面顯示角度；畫面上正向的物件在 PDF 內要逆轉 R
      pg.setRotation(degrees(R));
      for(const it of (P.items||[])){
        if(!isChanged(it)) continue;
        const pad=Math.max(0.4,it.size*0.04);
        pg.drawRectangle({x:it.t[4]-pad, y:it.t[5]+it.cd*it.size-pad, width:it.w+pad*2, height:(it.ca-it.cd)*it.size+pad*2,
          color:rgb(...it.bg.map(v=>v/255)), borderWidth:0});
        if(!it.deleted && it.text) await drawLine(pg, it.text, it, it.t[4], it.t[5], it.fsz, it.w, it.align);
      }
      // 螢光筆：畫在原有文字之上、新增物件之下，以 Multiply 混色讓黑字保持清楚
      for(const o of S.objs.filter(o=>o.P===P && o.type==='hl'))
        for(const r of o.rects) pg.drawRectangle({x:r.x0, y:r.y0, width:r.x1-r.x0, height:r.y1-r.y0,
          color:rgb(...fromHex(o.color).map(v=>v/255)), borderWidth:0, blendMode:BlendMode.Multiply});
      for(const o of S.objs.filter(o=>o.P===P && o.type!=='hl')){
        const B=pdfRect(P,o.x,o.y,o.w,o.h), color=o.color && rgb(...o.color.map(v=>v/255));
        if(o.type==='sig'){
          const img = o.imgType==='jpg' ? await doc.embedJpg(o.bytes) : await doc.embedPng(o.bytes);
          // PDF 的 rotate 以左下角為軸、逆時針為正；換算成以中心旋轉
          const deg=R-(o.rot||0), f=deg*Math.PI/180, w=o.w, h=o.h;
          const [cx,cy]=P.vp1.convertToPdfPoint(o.x+o.w/2, o.y+o.h/2);
          pg.drawImage(img,{x:cx-(Math.cos(f)*w/2-Math.sin(f)*h/2), y:cy-(Math.sin(f)*w/2+Math.cos(f)*h/2),
            width:w, height:h, rotate:degrees(deg)});
        }else if(o.type==='mark'){
          if(o.shape==='square') pg.drawRectangle({...B, color, borderWidth:0});
          else if(o.shape==='circle') pg.drawEllipse({x:B.x+B.width/2, y:B.y+B.height/2, xScale:B.width/2, yScale:B.height/2, color, borderWidth:0});
          else { const [x,y]=P.vp1.convertToPdfPoint(o.x,o.y); pg.drawSvgPath(MARK_CHECK,{x, y, scale:o.w/100, rotate:degrees(R), color, borderWidth:0}); }
        }else if(o.text.trim()){
          const lines=layoutText(o);
          for(let i=0;i<lines.length;i++){
            const [px,py]=P.vp1.convertToPdfPoint(o.x+TB_PAD, o.y+baseOff(o,i));
            await drawLine(pg, lines[i], o, px, py, o.size, o.w-TB_PAD*2, o.align, R);
          }
        }
      }
    }
    return await doc.save();
    }
    const files=[...new Set(list.map(P=>P.file))], saved=new Map();
    for(const f of files) saved.set(f, await editFile(f, list.filter(P=>P.file===f)));
    let out;
    const f0=files[0];
    // 匯出範圍內相鄰且已合併的兩頁
    const paired=new Set(); list.forEach((P,i)=>{ if(P.mate && list[i+1]===P.mate){ paired.add(P); paired.add(P.mate); } });
    if(files.length===1 && !paired.size && list.length===f0.doc.numPages && list.every((P,i)=>P.src===i)) out=saved.get(f0);
    else{   // 有合併、刪頁、排序或單頁匯出時，依目前順序重組頁面
      const res=await PDFDocument.create(), copied=new Map(), midPage=new Map();
      for(const f of files){
        const mid=await PDFDocument.load(saved.get(f),{ignoreEncryption:true}), ps=list.filter(P=>P.file===f);
        const singles=ps.filter(P=>!paired.has(P));
        (await res.copyPages(mid, singles.map(P=>P.src))).forEach((pg,i)=>copied.set(singles[i],pg));
        ps.filter(P=>paired.has(P)).forEach(P=>midPage.set(P, mid.getPage(P.src)));
      }
      for(let i=0;i<list.length;i++){
        const P=list[i];
        if(!paired.has(P)){ res.addPage(copied.get(P)); continue; }
        // 兩頁合一：內嵌頁面（文字仍是向量），依畫面上的位置縮放；/Rotate 用旋轉內容來呈現
        const sheet=res.addPage([P.sheetDim.w, P.sheetDim.h]);
        for(const X of [P, P.mate]){
          const src=midPage.get(X), cb=src.getCropBox(), R=viewRot(X), s=X.fit, W0=cb.width, H0=cb.height;
          const emb=await res.embedPage(src, {left:cb.x, bottom:cb.y, right:cb.x+W0, top:cb.y+H0});
          const vh=(R%180 ? W0 : H0)*s, tx=X.cell.x, ty=P.sheetDim.h-(X.cell.y+vh);
          const [x,y] = R===90 ? [tx, ty+W0*s] : R===180 ? [tx+W0*s, ty+H0*s] : R===270 ? [tx+H0*s, ty] : [tx, ty];
          sheet.drawPage(emb, {x, y, xScale:s, yScale:s, rotate:degrees(-R)});
        }
        i++;
      }
      out=await res.save();
    }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));
    a.download = !Array.isArray(only) ? `${baseName()}_edited.pdf`
      : only.length===1 ? `${baseName()}_第${pageNo(only[0])}頁.pdf` : `${baseName()}_第${pageNo(only[0])}-${pageNo(only[only.length-1])}頁.pdf`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    if(missing.size) toast(`無法讀取字型：${[...missing].join('、')}。<br>已改用替代方式輸出（英數用 PDF 內建字型、中文用高解析圖像）。<br>請使用 Chrome / Edge，並在詢問時允許存取「字型」；或確認電腦有安裝該字型。`);
  }catch(e){ console.error(e); alert('匯出失敗：'+e.message); }
  btn.disabled=false; status();
}

/* ---------- 事件 ---------- */
$('bOpen').onclick=()=>$('fPdf').click();
$('empty').onclick=()=>$('fPdf').click();
$('empty').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('fPdf').click(); } };
$('fPdf').onchange=e=>{ const f=[...e.target.files]; e.target.value=''; openFiles(f,false); };
$('bAddPdf').onclick=()=>$('fAdd').click();
$('fAdd').onchange=e=>{ const f=[...e.target.files]; e.target.value=''; openFiles(f,true); };
$('bHl').onclick=()=>setHl(!S.hl.on);
$('hlColors').innerHTML=hlSwatches(S.hl.color,'hlBar');
$('hlBar').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.hl.color=b.dataset.c;
  $('hlBar').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
$('bText').onclick=()=> S.pending?.type==='text' ? cancelPlace() : beginPlace({type:'text'});
document.querySelectorAll('.sym').forEach(b=>b.onclick=()=>
  S.pending?.type==='mark' && S.pending.shape===b.dataset.shape ? cancelPlace() : beginPlace({type:'mark', shape:b.dataset.shape}));
$('bSig').onclick=()=>$('fSig').click();
$('fSig').onchange=e=>{ if(e.target.files[0]) loadSigFile(e.target.files[0]); e.target.value=''; };
$('bPad').onclick=openPad;
$('bFont').onclick=()=>$('fFont').click();
$('fFont').onchange=e=>{ if(e.target.files[0]) addFont(e.target.files[0]); e.target.value=''; };
$('bExport').onclick=()=>exportPdf();
$('bRotL').onclick=()=>rotatePages(S.pages,-90);
$('bRotR').onclick=()=>rotatePages(S.pages,90);
$('bPair').onclick=()=>toggleAllPairs();
$('bSaveProj').onclick=()=>saveProject();
$('bOpenProj').onclick=()=>$('fProj').click();
$('fProj').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) openProject(f); };
$('marks').onchange=e=>$('viewer').classList.toggle('marks',e.target.checked);
$('zoom').onchange=async e=>{ S.scale=+e.target.value; if(hasDoc()) await renderAll(); };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ cancelPlace(); setHl(false); }
  const tag=document.activeElement?.tagName;
  if((e.key==='Delete'||e.key==='Backspace') && S.sel && !['TEXTAREA','INPUT','SELECT'].includes(tag)){
    e.preventDefault();
    if(S.sel.type) removeObj(S.sel);
    else { S.sel.deleted=true; refreshItem(S.sel); showSide(); status(); }
  }
});
const viewer=$('viewer');
viewer.addEventListener('dragover',e=>{ if(S.drag) return; e.preventDefault(); $('empty').classList.add('drag'); });
viewer.addEventListener('dragleave',()=>$('empty').classList.remove('drag'));
viewer.addEventListener('drop',e=>{
  if(S.drag) return;
  e.preventDefault(); $('empty').classList.remove('drag');
  const f=[...e.dataTransfer.files];
  const proj=f.find(x=>/\.json$/i.test(x.name));
  if(proj) return openProject(proj);
  const pdfs=f.filter(x=>/pdf$/i.test(x.type)||/\.pdf$/i.test(x.name));
  const img=f.find(x=>/^image\//.test(x.type));
  if(pdfs.length) openFiles(pdfs, hasDoc()); else if(img && hasDoc()) loadSigFile(img);
});
navigator.permissions?.query({name:'local-fonts'}).then(p=>{ if(p.state==='granted') getLocalFonts(); }).catch(()=>{});
showSide();
</script>
